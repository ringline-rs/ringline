[workspace]
resolver = "2"
members = [
    "ringline",
    "ringline-redis",
    "ringline-memcache",
    "ringline-quic",
    "ringline-h3",
    "ringline-h2",
    "ringline-ping",
    "ringline-grpc",
    "ringline-http",
    "ringline-bench",
    "ringline-benchmarks",
    "tools/doc-diagrams",
]
# The fuzz harness is its own workspace (nightly-only, own lockfile) so it
# cannot perturb --locked CI for the main workspace.
exclude = ["fuzz"]

[workspace.package]
authors = ["Brian Martin <brayniac@gmail.com>"]
edition = "2024"
# Minimum supported Rust version. Edition 2024 required 1.85, and let-chains
# in the core crate require 1.88; this records the real floor explicitly.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ringline-rs/ringline"

[workspace.dependencies]
# Internal crates
ringline = { path = "ringline", version = "0.7.0-alpha.0" }
ringline-quic = { path = "ringline-quic" }
ringline-http = { path = "ringline-http" }
ringline-h2 = { path = "ringline-h2" }
ringline-h3 = { path = "ringline-h3" }
ringline-redis = { path = "ringline-redis" }
ringline-memcache = { path = "ringline-memcache" }
ringline-grpc = { path = "ringline-grpc" }
ringline-ping = { path = "ringline-ping" }
resp-proto = "0.0.2"
memcache-proto = "0.0.5"
ping-proto = "0.0.2"
ketama = "0.0.2"

# External dependencies
bytes = "1.11.1"
histogram = "0.11"
itoa = "1"
libc = "0.2"
thiserror = "2"
# quinn-proto >= 0.11.19. Advisories that set this floor:
#   RUSTSEC-2026-0338    panic on zero-length STREAM frames during unordered reads
#   RUSTSEC-2026-0339    unbounded pending connection ID retirements
#   RUSTSEC-2026-0340    panic on a peer's minimum ACK delay with ACK_FREQUENCY
#   RUSTSEC-2026-0341    stream reassembly memory guard bypass
#   RUSTSEC-2026-0342    zero-length DATAGRAM frames bypass the receive buffer limit
#   RUSTSEC-2026-0343    outgoing datagram accounting panic (0.11.17 only)
#   GHSA-53rm-773f-4q8c  MAX_STREAM_DATA opens streams over the stream limit
#   GHSA-wppq-2f6r-wfvm  long Retry token panics or exhausts client memory
# Downstream resolvers respect this minimum even though the lockfile may
# resolve higher.
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-ring"] }
# rustls >= 0.23.45 patches RUSTSEC-2026-0285 (TLS 1.3 handshake messages
# accepted across an encryption-level boundary, GHSA-2mjx-qc3c-rqvc). It is
# also past RUSTSEC-2024-0399 (Acceptor::accept panic on fragmented
# ClientHello, CVE-2024-11738) and RUSTSEC-2024-0336 (complete_io infinite
# loop). Pin to the patched baseline so downstream resolvers can't
# accidentally land on a vulnerable 0.23.x.
rustls = { version = "0.23.45", default-features = false }
slab = "0.4"
rcgen = "0.13"
rustls-pki-types = "1"
webpki-roots = "0.26"
