[workspace]
resolver = "2"
members = [
    "ringline",
    "ringline-tls-config",
    "ringline-redis",
    "ringline-memcache",
    "ringline-quic",
    "ringline-h3",
    "ringline-h2",
    "ringline-ping",
    "ringline-grpc",
    "ringline-http",
    "ringline-bench",
    "ringline-benchmarks",
    "tools/doc-diagrams",
]
# The fuzz harness is its own workspace (nightly-only, own lockfile) so it
# cannot perturb --locked CI for the main workspace.
exclude = ["fuzz"]

[workspace.package]
authors = ["Brian Martin <brayniac@gmail.com>"]
edition = "2024"
# Minimum supported Rust version. Edition 2024 required 1.85, and let-chains
# in the core crate require 1.88; this records the real floor explicitly.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ringline-rs/ringline"

[workspace.dependencies]
# Internal crates
ringline = { path = "ringline", version = "0.7.0-alpha.25" }
ringline-tls-config = { path = "ringline-tls-config", version = "0.1.0" }
ringline-quic = { path = "ringline-quic" }
ringline-http = { path = "ringline-http" }
ringline-h2 = { path = "ringline-h2" }
ringline-h3 = { path = "ringline-h3" }
ringline-redis = { path = "ringline-redis" }
ringline-memcache = { path = "ringline-memcache" }
ringline-grpc = { path = "ringline-grpc" }
ringline-ping = { path = "ringline-ping" }
resp-proto = "0.0.2"
memcache-proto = "0.0.5"
ping-proto = "0.0.2"
ketama = "0.0.2"

# External dependencies
bytes = "1.11.1"
histogram = "0.11"
itoa = "1"
libc = "0.2"
thiserror = "2"
# ringline-quic-proto (ringline-rs/quinn) is quinn-proto 0.11 renamed and
# built on ringline-tls; ringline-quic depends on it. 0.1.0 is quinn-proto
# 0.11.19, past these advisories:
#   RUSTSEC-2026-0338    panic on zero-length STREAM frames during unordered reads
#   RUSTSEC-2026-0339    unbounded pending connection ID retirements
#   RUSTSEC-2026-0340    panic on a peer's minimum ACK delay with ACK_FREQUENCY
#   RUSTSEC-2026-0341    stream reassembly memory guard bypass
#   RUSTSEC-2026-0342    zero-length DATAGRAM frames bypass the receive buffer limit
#   RUSTSEC-2026-0343    outgoing datagram accounting panic (0.11.17 only)
#   GHSA-53rm-773f-4q8c  MAX_STREAM_DATA opens streams over the stream limit
#   GHSA-wppq-2f6r-wfvm  long Retry token panics or exhausts client memory
# `cargo audit` matches advisories by crate name and does not see this
# crate. The fork's advisory check covers the fork's branch, not this
# requirement. When the fork releases a later version on this requirement's
# minor version, its release workflow opens a pull request into main raising
# the requirement to it (admin/ringline-raise in ringline-rs/quinn). A move
# to a new minor version, or a raise on a maintenance branch, is done by
# hand.
# Downstream resolvers respect this minimum even though the lockfile may
# resolve higher.
ringline-quic-proto = { version = "0.1.0", default-features = false, features = ["rustls-ring"] }
# ringline-tls (ringline-rs/rustls) is a fork of rustls 0.23 under a new
# name, with record-layer changes listed in its RINGLINE.md; ringline and
# ringline-tls-config depend on it. It is based on rustls 0.23.46 and
# requires rustls-webpki >= 0.103.16, past:
#   RUSTSEC-2026-0346    Debug impls for client session values expose TLS secrets
#   RUSTSEC-2026-0347    buffered application data sent to the outer server
#                        after ECH rejection
#   RUSTSEC-2026-0348    Brotli certificate decompression can allocate up to
#                        1 GiB before authentication
#   RUSTSEC-2026-0349    an unauthenticated ServerHello can downgrade later
#                        connections to classical key exchange
#   RUSTSEC-2026-0382    certificate verification may accept distrusted
#                        intermediates (rustls-webpki)
# and RUSTSEC-2026-0285, RUSTSEC-2024-0399 and RUSTSEC-2024-0336.
# `cargo audit` matches advisories by crate name and does not see this
# crate. The fork's advisory check covers the fork's branch, not this
# requirement. When the fork releases a later version on this requirement's
# minor version, its release workflow opens a pull request into main raising
# the requirement to it (admin/ringline-raise in ringline-rs/rustls). A move
# to a new minor version, or a raise on a maintenance branch, is done by
# hand.
# Raised by ringline-rs/rustls's release workflow (admin/ringline-raise):
# 0.1.1 is rustls 0.23.46.
ringline-tls = { version = "0.1.1", default-features = false }
# Upstream quinn-proto and rustls are used only by tests and the unpublished
# benchmark crates: the tests check ringline against them, and
# ringline-bench's connect-bench client, ringline-benchmarks' tokio
# comparison clients and its HTTP/2 benchmark server use them. Their floors
# keep those builds off vulnerable versions.
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23.46", default-features = false }
slab = "0.4"
rcgen = "0.13"
rustls-pki-types = "1"
# webpki-roots >= 1.0.10 (dev-dependencies and benchmarks only):
#   RUSTSEC-2026-0381    bundles emSign ECC Root CA - G3, which allows paths
#                        through distrusted emSign intermediates (0.26.x has
#                        no fixed release)
webpki-roots = "1.0.10"
