[package]
name = "ringline-bench"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ringline-bench"
path = "src/main.rs"

[[bin]]
name = "bench-server"
path = "src/bin/server.rs"

[[bin]]
name = "bench-client"
path = "src/bin/client.rs"

# The proxy forwarding A/B (#407) is one-way: client -> proxy -> drain. Its
# load generator and sink are separate binaries rather than modes on
# bench-client/bench-server, so the harness the comparison campaign depends on
# is not perturbed by work that has nothing to do with it.
# Connect-rate arm: its own binary for the same reason proxy-load is, so the
# harness the accept-mode comparison depends on is not perturbed by it.
[[bin]]
name = "connect-bench"
path = "src/bin/connect-bench.rs"

[[bin]]
name = "close-latency"
path = "src/bin/close-latency.rs"

[[bin]]
name = "proxy-load"
path = "src/bin/proxy-load.rs"

[[bin]]
name = "proxy-drain"
path = "src/bin/proxy-drain.rs"

# Mirrors ringline's own feature so `build.rs` sees CARGO_FEATURE_FORCE_MIO.
# Building the mio arm as `--features ringline/force-mio` alone would leave
# this crate's has_io_uring set while the runtime dropped it, and the
# `#[cfg(has_io_uring)]` calls here would not compile.
[features]
force-mio = ["ringline/force-mio"]
# tokio-uring is Linux-only and pulls its own io_uring stack, so it is opt-in
# rather than a default dependency of the harness. It exists to answer one
# question: how much of ringline's lead is the I/O interface rather than the
# scheduler shape.
tokio-uring-arm = ["dep:tokio-uring"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(has_io_uring)"]

[dependencies]
# `bench-server --accept-mode` and `--park` drive the unstable accept API. This
# turns the feature on for every build that includes this crate, `--workspace`
# among them; `-p ringline` is the build that has it off.
ringline = { workspace = true, features = ["unstable-accept"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
metriken = "0.11.3"
libc = { workspace = true }
clap = { version = "4", features = ["derive"] }
bytes = { workspace = true }
# For the connect-rate arm: a self-signed cert generated at startup, so nothing
# has to be staged onto a guest.
rustls = { workspace = true, features = ["ring", "std"] }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5", optional = true }
