# Does per-request application work move the worker-count optimum?
#
# Everything measured on this workload so far had ZERO application work, which
# makes echo the best case for concentrating connections: with no service time the
# runtime's own overhead IS the cost, so cutting that overhead shows at full
# strength. `--service-time-us` (a busy spin, charged per request) adds the work a
# real protocol server does.
#
# THE ARITHMETIC UNDER TEST. Coalescing takes completions per operation from ~2.0
# to ~0.5, and a completion costs ~8us on this rig, so concentration is worth
# ~12us per request -- all of it overhead, none of it service time. As a fraction
# of total cost that decays fast:
#
#   service   spread   concentrated   headroom coalescing can recover
#      0us     16us          4us         75%
#     25us     41us         29us         29%
#    100us    116us        104us         10%
#
# PREDICTIONS, written before the run.
#
# 1. w2 keeps up at 0us and FAILS at 25us and 100us. Every row offers w2 twice its
#    naive per-worker capacity, so w2 must recover ~50% from coalescing to serve
#    it. Available: 75%, 29%, 10%. At 0us that already happened -- two workers
#    served 600k, which naive capacity calls impossible. It cannot happen at 100us.
# 2. The p99 optimum moves to a HIGHER worker count as service time rises, and the
#    value of concentrating shrinks. Measure it as ops per worker-CPU-second, w2
#    against w16: predicted ~4x at 0us, ~1.1x at 100us.
# 3. The 12-physical-core budget stops binding. The budget is
#    `workers + softirq(rate) <= physical cores`, and softirq scales with PACKET
#    rate, which falls 12x across these rows. So the w8/w16 tail penalty measured
#    at 600k should largely vanish at 48k -- a second, independent reason for the
#    optimum to move up.
# 4. CQE/op still falls with concentration in every row, because queue depth still
#    rises. What shrinks is not the coalescing but its VALUE.
#
# NO-GO for the framing: if the optimum does not move and concentration keeps its
# advantage at 100us, then service time is not diluting runtime overhead and the
# arithmetic above is wrong somewhere.
#
# THE CONFOUND, stated plainly. Service time and packet rate cannot both be held
# constant -- capacity collapses with service time, so the rate must fall with it,
# and each row therefore differs in TWO ways. That is unavoidable here, and it is
# why prediction 3 is separately checkable: softirq is measured per arm from the
# Rezolus per-vCPU recording, so whether the core budget binds is read off the data
# rather than assumed. Read "does the knee move" (comparable across rows) and not
# "is throughput higher" (not comparable).
#
# VALIDITY GATE: queue depth, not achieved rate. `offered x p50 / connections` is
# requests in flight per connection -- under ~1 means keeping up, hundreds means
# collapse. An arm that meets its offered rate while queueing deeply is a capacity
# measurement, not a point on a cost curve. (1.2M, w8) passed a >=95%
# achieved-rate gate at 150 ms p50, which is how that was learned.
#
name = "svc s{service_time_us} w{workers} rep{rep}"

[matrix]
context_name = "ringline: does application work move the worker-count optimum? (#443)"
service_time_us = ["0", "25", "100"]
workers = ["2", "4", "8", "16"]
rep = ["1"]

[params]
# Update to the artifact id of a fresh `ringline min-complete build`.
bins_artifact = "01a0eb8b-8db4-7362-8c1a-65c630f602da"
image         = "spool/images/debian-13-6.12-20260912.1@golden"
server_ip     = "172.31.0.1"
client_ip     = "172.31.0.2"
port          = "7878"
clients       = "256"
msg_size      = "64"
warmup        = "5"
duration      = "90"

# ── server: hv02 ───────────────────────────────────────────────────────────

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535
nproc
uname -r
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "ringline-server"
payload = '''
exec /home/anvil/out/bench-server --runtime ringline --addr {server_ip}:{port} \
  --workers {workers} --msg-size {msg_size} --accept-mode merged \
  --echo-mode forward --service-time-us {service_time_us} \
  --metrics-out /home/anvil/metrics.json
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/cpu.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil
mkdir -p cpu
echo "service_time_us={service_time_us} workers={workers} rep={rep}" > cpu/arm.txt

# One window over the steady state: there is no readmit here, so the before/
# after pair the park runs needed collapses to a single span.
sleep 12
grep '^cpu[0-9]' /proc/stat > cpu/stat-open
sleep 70
grep '^cpu[0-9]' /proc/stat > cpu/stat-close

# Sample every cpu and score it without assuming a worker->cpu mapping. The
# guest enumerates SMT siblings adjacently, so ringline's SMT-aware pinning
# puts worker W on cpu 2W; a cpu0..cpu7 window would miss half the workers.
# That mistake cost a whole round of park runs.
awk '
  FNR==NR { for (i=2;i<=NF;i++) b[$1,i]=$i; next }
  {
    tot=0; for (i=2;i<=NF;i++) tot += $i - b[$1,i]
    idle=($5-b[$1,5])+($6-b[$1,6])
    pct = (tot>0 ? 100.0*(tot-idle)/tot : 0)
    printf "%s %.1f\n", $1, pct
    sum += pct; if (pct > 50) loaded++
  }
  END { printf "SUMMARY loaded_cores=%d total_busy_pct=%.1f\n", loaded+0, sum+0 }
' cpu/stat-open cpu/stat-close | tee cpu/per-core.txt

cp /home/anvil/metrics.json cpu/ 2>/dev/null || echo "no metrics.json yet" >> cpu/per-core.txt
tar czf /home/anvil/cpu.tgz -C /home/anvil cpu
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/metrics.json"]
payload = '''
# SIGTERM so the server runs its shutdown path and dumps counters.
sudo systemctl stop ringline-server 2>/dev/null || true
sleep 2
echo "--- counters ---"
python3 - <<'EOF'
import json,sys
m = dict()
for e in json.load(open("/home/anvil/metrics.json")):
    m[(e["name"], e.get("op"))] = e["value"]
def g(n, o):
    return m.get(("ringline/" + n, o))
acc = g("connections", "accepted")
for k in ("accepted", "adopted", "park_started", "park_completed"):
    print("%-16s= %s" % (k, g("connections", k)))
print("%-16s= %s" % ("bytes_received", g("bytes", "received")))
# The run has to prove it carried load before any ratio computed from it means
# anything. accepted==1 is the /dev/tcp reachability probe alone -- the
# signature of a client that never started, which made six park runs unreadable.
want = {clients}
if acc is None or acc < want:
    print("FATAL: accepted=%s < clients=%s: no workload, counters uninterpretable" % (acc, want))
    sys.exit(1)
print("workload OK: accepted=%s >= clients=%s" % (acc, want))
EOF
rc=$?
exit $rc
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

# ── client: hv01 ───────────────────────────────────────────────────────────

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo prlimit --nofile=1000000 --pid $$ 2>/dev/null || true
echo "fd soft=$(ulimit -Sn) hard=$(ulimit -Hn) clients={clients}"
ip -4 -brief addr show
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/client.log"]
payload = '''
set -uo pipefail
cd /home/anvil
for i in $(seq 1 120); do
  (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; echo "server reachable after ${i}s"; break; }
  sleep 1
done
# Offered rate is a FUNCTION of service time, not an independent axis. A worker's
# capacity is ~1/(service_time + overhead), so no single rate exercises all three
# rows: 600k would put every arm of the 100us row 12x past capacity and measure
# nothing but collapse. Each row gets the rate that lands w4 near saturation, so
# "where is the knee" stays comparable across rows even though throughput cannot.
case "{service_time_us}" in
  0)   RATE=600000 ;;   # ~125k/worker capacity -> w4 at 150k/worker
  25)  RATE=150000 ;;   # ~30k/worker           -> w4 at 37.5k/worker
  100) RATE=48000  ;;   # ~9.3k/worker          -> w4 at 12k/worker
  *)   echo "no rate defined for service_time_us={service_time_us}"; exit 1 ;;
esac
echo "service_time={service_time_us}us -> offered rate ${RATE}"
# Open loop at a fixed offered rate: the question is the cost per operation at
# constant throughput, so the load must not adapt to the server's latency the
# way a closed loop would.
./out/bench-client --runtime ringline --addr {server_ip}:{port} --clients {clients} \
  --threads 8 --msg-size {msg_size} --warmup {warmup} --duration {duration} \
  --open --rate "$RATE" \
  2>&1 | tee /home/anvil/client.log
rc=${PIPESTATUS[0]}
echo "client_rc=${rc}" | tee -a /home/anvil/client.log
# A run with no load must not be reportable as a result.
exit "$rc"
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
