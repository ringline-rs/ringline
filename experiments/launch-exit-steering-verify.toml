# Control-then-fix run for #783: `a_worker_stopping_during_launch_does_not_hang_it`
# waits for the stopped worker before it connects, and
# `an_exit_before_the_listener_is_added_is_applied_once_it_is` pins the
# steering `launch()` applies to an exit recorded before it adds the listener.
#
# macOS cannot type-check the io_uring path, so the tests run here, in an
# ephemeral VM on the `validation` agent, never by a login to a rig host
# (CLAUDE.md, "Verifying io_uring code").
#
# Three refs. `red_ref` (branch `flake-783-red2`) delays the injected worker
# exit by 20 ms, so the exit lands after `launch()` returns; keeps the test's
# old shape, connecting as soon as `launch()` returns; and empties
# `reapply_exits`. Step 1 expects both tests to fail: the first with `Closed`
# entries, the connections that landed on the stopped worker's socket and
# were closed with its queue, which is the mechanism behind the two CI
# failures; the second because nothing steers around the recorded exit.
# `delayed_ref` (branch `flake-783-delayed2`) is the head plus the same 20 ms
# delay. Step 2 expects both tests to pass: the fixed test waits for the exit
# whichever side of `launch()` it lands. Step 3 runs the two tests 30 times at
# the head and then the uring gate.
#
# Prediction: red_rc non-zero with `2 failed` and at least one `Closed` in the
# first test's result vector; delayed_rc 0 with `2 passed`; head_fail_runs=0;
# every gate 0. A red that reads `1 failed`, the second test alone, means the
# 20 ms delay did not put the exit after `launch()` on this host, not that the
# mechanism is wrong.
#
#   systemslab submit experiments/launch-exit-steering-verify.toml
name = "ringline launch-exit-steering verify ({branch})"

[params]
branch = "flake-783"
repo   = "https://github.com/brayniac/ringline"
red_ref = "a12cd4f45abe28b173f556deb1663b19a3488486"
delayed_ref = "3c7db4223c44f82650cfed919880c9fb7a36859c"
tests  = "a_worker_stopping_during_launch_does_not_hang_it an_exit_before_the_listener_is_added_is_applied_once_it_is"

[[jobs]]
name = "verify"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "debian-13-6.12"
slots = 1
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 7200
artifacts = ["/home/anvil/verify.log"]
upload = true
payload = '''
set -uo pipefail
cat /etc/anvil-instance.json 2>/dev/null; echo
rustc -V 2>/dev/null; uname -r
cd /home/anvil
{
  uname -srm
  echo "io_uring_disabled=$(sysctl -n kernel.io_uring_disabled 2>/dev/null || echo unset)"
  cargo --version

  git clone -q {repo} src && git -C src checkout -q {branch}
  cd src && git log --oneline -3

  ulimit -Sn 65536
  echo "nofile_soft=$(ulimit -Sn)"

  # This must be the io_uring build; a mio build would run none of the code
  # under test and report green for it.
  cargo build --locked -q -p ringline-bench --bin bench-server
  got=$(./target/debug/bench-server --print-backend)
  [ "$got" = "io_uring" ] || { echo "BACKEND MISMATCH: $got"; echo "gate_backend=1"; exit 1; }
  echo "gate_backend=0 (backend=$got)"

  # Step 1: the control. Not piped: a piped cargo reports the pipe's status.
  git checkout -q {red_ref} && git log --oneline -1
  cargo test --locked -p ringline --lib -- {tests} > /home/anvil/red.out 2>&1
  echo "red_rc=$?"
  grep -E '^test .*FAILED|^test result|panicked|Closed|Hung' /home/anvil/red.out
  echo "red_summary=$(grep -E '^test result' /home/anvil/red.out | head -1)"
  echo "red_closed=$(grep -E '^\[' /home/anvil/red.out | grep -c Closed)"

  # Step 2: the fixed tests under the same delay.
  git checkout -q {delayed_ref} && git log --oneline -1
  cargo test --locked -p ringline --lib -- {tests} > /home/anvil/delayed.out 2>&1
  echo "delayed_rc=$?"
  grep -E '^test .*FAILED|^test result|panicked' /home/anvil/delayed.out
  echo "delayed_summary=$(grep -E '^test result' /home/anvil/delayed.out | head -1)"

  # Step 3: the head, 30 runs of the two tests, then the uring gate.
  git checkout -q {branch} && git log --oneline -1
  cargo test --locked -p ringline --lib --no-run > /dev/null 2>&1
  fails=0
  for i in $(seq 1 30); do
    if ! cargo test --locked -p ringline --lib -- {tests} > /home/anvil/head.$i.out 2>&1; then
      fails=$((fails+1)); echo "head run $i FAILED"; grep -E 'panicked|Closed|Hung' /home/anvil/head.$i.out | head -5
    fi
  done
  echo "head_fail_runs=$fails"
  echo "head_summary=$(grep -E '^test result' /home/anvil/head.1.out | head -1)"

  cargo fmt --all --check; echo "gate_fmt=$?"
  cargo clippy --locked --all-targets -- -D warnings; echo "gate_clippy_uring=$?"
  cargo clippy --locked --all-targets --features force-mio -- -D warnings; echo "gate_clippy_mio=$?"
  cargo clippy --locked --all-targets --features tls-buffered -- -D warnings; echo "gate_clippy_tls=$?"
  RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ringline; echo "gate_doc=$?"
  cargo test --locked --all; echo "gate_test_uring=$?"
} 2>&1 | tee /home/anvil/verify.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
fail=0
grep -q "^gate_backend=0" verify.log || { echo "FAIL gate_backend"; fail=1; }
grep -q "^red_rc=[1-9]" verify.log || { echo "FAIL red: the tests passed on the control"; fail=1; }
red=$(grep -oE "^red_summary=.*" verify.log); echo "$red"
echo "$red" | grep -qE "; 2 failed;" || { echo "FAIL red: expected 2 failed"; fail=1; }
closed=$(grep -oE "^red_closed=[0-9]+" verify.log); echo "$closed"
[ "${closed#red_closed=}" -ge 1 ] 2>/dev/null || { echo "FAIL red: no Closed entry"; fail=1; }
grep -q "^delayed_rc=0" verify.log || { echo "FAIL delayed"; fail=1; }
delayed=$(grep -oE "^delayed_summary=.*" verify.log); echo "$delayed"
echo "$delayed" | grep -qE "2 passed; 0 failed;" || { echo "FAIL delayed: expected 2 passed"; fail=1; }
grep -q "^head_fail_runs=0" verify.log || { echo "FAIL head runs: $(grep -oE '^head_fail_runs=[0-9]+' verify.log)"; fail=1; }
grep -oE "^head_summary=.*" verify.log
for gate in gate_fmt gate_clippy_uring gate_clippy_mio gate_clippy_tls gate_doc gate_test_uring; do
  if ! grep -q "^${gate}=0" verify.log; then
    got=$(grep -oE "^${gate}=[0-9]+" verify.log | head -1)
    echo "FAIL ${gate}: ${got:-never reached}"
    fail=1
  else
    echo "ok   ${gate}"
  fi
done
exit $fail
'''
