name = "abort-close probe on {image} ({ref})"

# Experiment A of docs/send-admission-design.md, section 3; results in
# docs/journal/2026-11-abort-close.md. Builds experiments/abort-close-probe.c
# from {ref} and runs every arm at 0, 1 and 256 idle connections, five rounds
# each, one process per round. Run once per kernel, e.g.
#   systemslab submit experiments/abort-close-probe.toml -p image=ubuntu-24.04-6.8
# The prediction and what refutes it are in the journal entry; `plain` is the
# control (the notification must never land).

[params]
image = "debian-13-6.12"
ref = "main"
repo = "https://github.com/ringline-rs/ringline"

[[jobs]]
name = "vm"
tags = ["hypervisor", "x86_64"]

[[jobs.steps]]
uses = "anvil-vm"
[jobs.steps.with]
shape = "auto.c"
image = "{image}"
gpu = false
boot_timeout = 600
payload_timeout = 3600
artifacts = ["/tmp/job/run.log", "/tmp/job/results.txt"]
payload = '''
set -o pipefail
mkdir -p /tmp/job
echo 0 > /tmp/job/status
{
  echo "== guest =="; uname -r; nproc; grep PRETTY /etc/os-release
  if ! command -v cc >/dev/null || ! command -v git >/dev/null; then
    sudo apt-get update -qq
    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential git >/dev/null
  fi
  git clone -q {repo} /tmp/job/src || { echo "clone failed"; echo 1 > /tmp/job/status; exit 1; }
  git -C /tmp/job/src checkout -q {ref} || { echo "checkout of {ref} failed"; echo 1 > /tmp/job/status; exit 1; }
  echo "== probe at $(git -C /tmp/job/src log --oneline -1)"
  cc -O2 -Wall -o /tmp/job/probe /tmp/job/src/experiments/abort-close-probe.c || { echo "build failed"; echo 1 > /tmp/job/status; exit 1; }
  set +e
  for idle in 0 1 256; do
    for arm in plain linger cancel_linger unspec cancel_unspec batch; do
      for r in 1 2 3 4 5; do
        out=$(/tmp/job/probe $arm $idle 2>&1)
        echo "round=$r $out" | tee -a /tmp/job/results.txt
      done
    done
  done
  echo done
} 2>&1 | tee /tmp/job/run.log
# The group above runs in a subshell, so its failures are reported here.
exit "$(cat /tmp/job/status)"
'''
