# The scale run of docs/recv-direct-design.md (Evidence, "Scale"): direct
# receive at 250 and 1,000 connections per worker, against the provided-buffer
# ring at two sizes. The run IDs are listed there.
#
# Server: Valkey (RESP) and memcached on z1.
# Client: cachecannon on z2, 16 threads, `connections` in total (4000 or
# 16000), GET only, read_values on, no rate limit. Bins: the C8 build, bins
# artifact 01a159f3-e054-73af-bc3f-8b6ea08f60b1, built by
# experiments/segviews-build.toml on the brayniac/ringline fork's
# feat/segment-clients branch; its ringline is the code merged as #684, with
# direct receive selected per connection by cachecannon's
# general.recv_direct.
#
# Builds in `order`:
#   a   cachecannon-a: multishot ring, 256 x 16 KiB per worker (its default).
#   ar  cachecannon-a: multishot ring, 1024 x 16 KiB per worker, at least one
#       buffer per connection at 1,000 per worker.
#   c   cachecannon-c with general.recv_direct.
#
# Cells: RESP and memcache text GET at the value sizes in `vlens`, pipeline
# depth 1 and 16. No 1 MiB cells: at 16,000 connections they would hold about
# 16 GiB of partial values.
#
# Each run records cachecannon's JSON result, its parquet metrics (ringline's
# RECV_RING and recv_direct counters among them), user and system CPU and
# peak RSS from /usr/bin/time, and RSS halfway through the measured period.
# The client sets tcp_tw_reuse = 1: back-to-back 16,000-connection runs
# otherwise run out of ephemeral ports to TIME-WAIT sockets.
name = "recv-direct scale c{connections} rep{rep}"

[params]
bins_artifact  = "01a159f3-e054-73af-bc3f-8b6ea08f60b1"
rep            = "1"
order          = "a ar c"
image          = "debian-13-6.12"
server_ip      = "172.31.0.1"
client_ip      = "172.31.0.2"
client_threads = "16"
connections    = "4000"
vlens          = "64 4096 65536"
warmup         = "10s"
duration       = "40s"

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload_timeout = 1200
payload = '''
set -uo pipefail
cat /etc/anvil-instance.json
uname -r
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.core.rmem_max=134217728 net.core.wmem_max=134217728
sudo apt-get update -qq
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq valkey-server memcached >/dev/null || exit 1
# The packages start their own services on localhost; stop them. The bench
# servers run as units named bench-*, because the packages' unit names
# (valkey, memcached) are taken.
sudo systemctl disable --now valkey-server memcached 2>/dev/null || true
valkey-server --version
memcached -V
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "bench-valkey"
metrics = true
payload = "ulimit -n 1048576; exec valkey-server --bind {server_ip} --port 6379 --protected-mode no --save '' --appendonly no --io-threads 8 --maxclients 65000"

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "bench-memcached"
payload = "ulimit -n 1048576; exec memcached -l {server_ip} -p 11211 -t 16 -m 16384 -c 65000 -I 2m -U 0"

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 14400

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload_timeout = 1200
inputs = [{ artifact = "{bins_artifact}", name = "bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bins.tgz && chmod +x out/*
( cd out && sha256sum * )
cat /etc/anvil-instance.json; echo
uname -r
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 net.ipv4.ip_local_port_range="1024 65535" net.ipv4.tcp_tw_reuse=1
free -m
nproc
echo "thp enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
echo "thp defrag: $(cat /sys/kernel/mm/transparent_hugepage/defrag)"
sudo apt-get update -qq
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq time >/dev/null || exit 1
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
artifacts = ["/home/anvil/results.tgz"]
payload_timeout = 14000
payload = '''
set -uo pipefail
cd /home/anvil
mkdir -p results
ulimit -n 1048576
# Linux 6.14+ charges io_uring rings to RLIMIT_MEMLOCK; harmless before.
ulimit -l unlimited 2>/dev/null || sudo prlimit --memlock=unlimited:unlimited --pid $$
echo "client-limits memlock=$(ulimit -l) nofile=$(ulimit -n)"
for port in 6379 11211; do
  for i in $(seq 1 120); do
    (exec 3<>/dev/tcp/{server_ip}/$port) 2>/dev/null && { exec 3>&-; echo "port $port reachable after $i s"; break; }
    sleep 1
  done
done
order="{order}"
echo "rep={rep} connections={connections} order=$order vlens={vlens}"

# config FILE PROTO PORT VLEN KEYS DEPTH PREFILL DURATION WARMUP PARQUET RECV
# RECV: plain (256 x 16 KiB), ring1024 (1024 x 16 KiB) or direct.
config() {
  local file=$1 proto=$2 port=$3 vlen=$4 keys=$5 depth=$6 prefill=$7 dur=$8
  shift 8
  local warm=$1 parquet=$2 recv=$3
  local prefill_line="prefill = false" ring_lines=""
  [ "$prefill" = true ] && prefill_line=$'prefill = true\nprefill_settle = "0s"'
  case $recv in
    ring1024) ring_lines=$'recv_ring_size = 1024\nrecv_buffer_size = 16384' ;;
    direct) ring_lines='recv_direct = true' ;;
  esac
  cat > "$file" <<CFG
[general]
duration = "$dur"
warmup = "$warm"
threads = {client_threads}
ringline_diag = true
$ring_lines

[target]
endpoints = ["{server_ip}:$port"]
protocol = "$proto"

[connection]
connections = {connections}
pipeline_depth = $depth
connect_timeout = "10s"
request_timeout = "5s"

[workload]
read_values = true
$prefill_line

[workload.keyspace]
length = 16
count = $keys
distribution = "uniform"

[workload.commands]
get = 100

[workload.values]
length = $vlen

[admin]
format = "json"
parquet = "$parquet"
CFG
}

# run_cell CELL PROTO PORT VLEN KEYS DEPTH: run every build in `order` on one
# cell with no rate limit.
run_cell() {
  local cell=$1 proto=$2 port=$3 vlen=$4 keys=$5 depth=$6
  local b bin recv run pid rc half
  for b in $order; do
    case $b in c) bin=out/cachecannon-c; recv=direct ;; ar) bin=out/cachecannon-a; recv=ring1024 ;; a) bin=out/cachecannon-a; recv=plain ;; *) echo "BAD BUILD $b"; continue ;; esac
    run="$cell-$b"
    config results/$run.toml $proto $port $vlen $keys $depth false {duration} {warmup} results/$run.parquet $recv
    /usr/bin/time -f "time user_s=%U sys_s=%S maxrss_kb=%M" -o results/$run.time \
      $bin results/$run.toml > results/$run.json 2> results/$run.log &
    pid=$!
    half=$(( $(echo {warmup} | tr -d s) + $(echo {duration} | tr -d s) / 2 ))
    ( sleep $half; c=$(pgrep -P $pid | head -1); [ -n "$c" ] && grep -E '^(Rss|AnonHugePages):' /proc/$c/smaps_rollup > results/$run.smaps ) &
    wait $pid
    rc=$?
    echo "== rep={rep} conns={connections} cell=$cell build=$b rc=$rc $(cat results/$run.time)"
    grep '"type":"result"' results/$run.json || { echo "NO RESULT"; tail -5 results/$run.log; }
    grep -c "connect failed" results/$run.log | sed 's/^/connect_failed=/'
    sleep 3
  done
}

for proto in resp memcache; do
  case $proto in resp) port=6379;; memcache) port=11211;; esac
  for vlen in {vlens}; do
    case $vlen in
      64) keys=1000000;;
      4096) keys=100000;;
      8192) keys=50000;;
      65536) keys=5000;;
      *) echo "BAD VLEN $vlen"; continue;;
    esac
    # Write every key once; not measured.
    config results/prefill-$proto-v$vlen.toml $proto $port $vlen $keys 1 true 1s 0s results/prefill-$proto-v$vlen.parquet plain
    ./out/cachecannon-a results/prefill-$proto-v$vlen.toml > results/prefill-$proto-v$vlen.json 2> results/prefill-$proto-v$vlen.log
    echo "== prefill $proto v$vlen rc=$?"
    for depth in 1 16; do
      run_cell "$proto-v$vlen-d$depth" $proto $port $vlen $keys $depth
    done
  done
done
tar czf /home/anvil/results.tgz -C /home/anvil results
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 14400

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
