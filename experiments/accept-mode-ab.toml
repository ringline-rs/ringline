# Accept-mode A/B: does merged accept mode place a pooled client's connections
# as evenly as the acceptor pool's explicit round-robin?
#
# Topology is the whole point. ONE client host opens a pool of connections to
# one server. That is the adversarial case for the kernel's 4-tuple hash (only
# the source port varies) and the case the design doc says decides whether
# merged mode can be the default. Measured from N independent clients the
# effect disappears.
#
# Distribution signal is per-CPU busy time from /proc/stat, diffed across the
# measured window. Workers are pinned, so core N is worker N. No rezolus
# parsing, and immune to a detached unit's recording spanning boot-to-stop.
#
# One arm per experiment; submit interleaved (pool merged pool merged ...) and
# discard the first of each.
name = "ringline accept-mode A/B {accept_mode} rep{rep}"

[params]
bins_artifact  = "01a0ccfb-0333-7309-cd6b-de35665367fe"
accept_mode    = "pool"
rep            = "1"
image          = "debian-13-6.12"
server_ip      = "172.31.0.1"
client_ip      = "172.31.0.2"
port           = "7878"
server_workers = "8"
client_threads = "8"
clients        = "64"
msg_size       = "256"
warmup         = "5"
duration       = "20"

# ── server: hv02 ───────────────────────────────────────────────────────────

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
cat /etc/anvil-instance.json
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.core.rmem_max=134217728 net.core.wmem_max=134217728
ip -4 -brief addr show
nproc
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "ringline-server"
payload = "exec /home/anvil/out/bench-server --runtime ringline --addr {server_ip}:{port} --workers {server_workers} --msg-size {msg_size} --accept-mode {accept_mode}"

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

# Per-core busy time across the measured window only. Sleeping past the
# client's warmup first keeps connection setup out of the sample.
[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/cpu.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil
mkdir -p cpu
echo "accept_mode={accept_mode} rep={rep} workers={server_workers}" > cpu/arm.txt
systemctl is-active ringline-server >> cpu/arm.txt 2>&1 || true
sleep $(( {warmup} + 3 ))
grep '^cpu[0-9]' /proc/stat > cpu/stat-before
sleep {duration}
grep '^cpu[0-9]' /proc/stat > cpu/stat-after
# busy = total - idle - iowait, per core, over the window
awk '
  FNR==NR { for (i=2;i<=NF;i++) b[$1,i]=$i; next }
  {
    tot=0; for (i=2;i<=NF;i++) tot += $i - b[$1,i];
    idle = ($5 - b[$1,5]) + ($6 - b[$1,6]);
    busy = tot - idle;
    printf "%s busy=%d total=%d pct=%.1f\\n", $1, busy, tot, (tot>0 ? 100.0*busy/tot : 0);
  }
' cpu/stat-before cpu/stat-after | tee cpu/per-core.txt
tar czf /home/anvil/cpu.tgz -C /home/anvil cpu
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

# ── client: hv01 ───────────────────────────────────────────────────────────

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 net.ipv4.ip_local_port_range="1024 65535"
ip -4 -brief addr show
ping -c 2 -W 2 {server_ip} || echo "WARN: server not reachable yet"
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/results.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil
mkdir -p results
echo "accept_mode={accept_mode} rep={rep}" | tee results/arm.txt
for i in $(seq 1 120); do
  (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; echo "server reachable after ${i}s"; break; }
  sleep 1
done
ulimit -n 500000
./out/bench-client --runtime ringline --addr {server_ip}:{port} --clients {clients} \
  --msg-size {msg_size} --warmup {warmup} --duration {duration} --threads {client_threads} \
  > results/results.json 2> results/client.log
cat results/results.json
tar czf /home/anvil/results.tgz -C /home/anvil results
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
