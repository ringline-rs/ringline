# Red-then-green run for the forced close that runs once and the
# capacity flag that follows the drained queue, plus the uring gate on the
# result.
#
# macOS cannot type-check the io_uring path, so the failing tests and the fix
# are both checked here, in an ephemeral VM on the `validation` agent, never
# by a login to a rig host (CLAUDE.md, "Verifying io_uring code").
#
# `red_ref` is the branch's tests-only commit, before the fix. Step 1 runs the
# named tests there and expects two failures (the tests that pin the new
# behaviour), and six passes (the control test and the five pre-existing
# tests the list names). Step 2 runs the same names at the branch head and
# expects eight passes.
# Step 3 is `experiments/uring-gate.toml`'s check list on the branch head,
# with rustdoc added because the change edits doc comments behind
# `has_io_uring`.
#
#   systemslab submit experiments/force-finalize-once-verify.toml
name = "ringline force-finalize-once verify ({branch})"

[params]
branch = "fix/uring-force-finalize-per-tick"
repo   = "https://github.com/brayniac/ringline"
red_ref = "da37dab6ff65b38cc1dd66dd840d545c2bd41f8d"
tests  = "a_forced_close_blocked_on_a_shutdown_runs_once resetting_an_empty_send_queue_releases_no_capacity a_forced_close_abandoning_an_unawaited_send_releases_capacity force_finalize_close_aborts_a_queued_bounded_send ctx_close_arms_a_close_notify_deadline_on_tls graceful_close_arms_no_close_notify_deadline close_notify_waits_for_a_pool_slot_when_the_pool_is_exhausted_at_close close_notify_dropped_for_lack_of_a_slot_is_not_recorded_as_sent"

[[jobs]]
name = "verify"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "debian-13-6.12"
slots = 1
# 8 GiB: the `cargo test --all` build of the whole workspace is killed for
# memory at 4.
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 7200
artifacts = ["/home/anvil/verify.log"]
upload = true
payload = '''
set -uo pipefail
cat /etc/anvil-instance.json 2>/dev/null; echo
rustc -V 2>/dev/null; uname -r
cd /home/anvil
{
  uname -srm
  echo "io_uring_disabled=$(sysctl -n kernel.io_uring_disabled 2>/dev/null || echo unset)"
  cargo --version

  git clone -q {repo} src && git -C src checkout -q {branch}
  cd src && git log --oneline -2

  ulimit -Sn 65536
  echo "nofile_soft=$(ulimit -Sn)"

  # This must be the io_uring build; a mio build would run none of the code
  # under test and report green for it.
  cargo build --locked -q -p ringline-bench --bin bench-server
  got=$(./target/debug/bench-server --print-backend)
  [ "$got" = "io_uring" ] || { echo "BACKEND MISMATCH: $got"; echo "gate_backend=1"; exit 1; }
  echo "gate_backend=0 (backend=$got)"

  # Step 1: the tests at the tests-only commit, on the unfixed code. Not
  # piped: a piped cargo reports the pipe's status.
  git checkout -q {red_ref} && git log --oneline -1
  cargo test --locked -p ringline --lib -- {tests} > /home/anvil/red.out 2>&1
  echo "red_rc=$?"
  grep -E '^test |^test result' /home/anvil/red.out
  echo "red_summary=$(grep -E '^test result' /home/anvil/red.out | head -1)"
  git checkout -q {branch} && git log --oneline -1

  # Step 2: the same tests on the fix.
  cargo test --locked -p ringline --lib -- {tests} > /home/anvil/green.out 2>&1
  echo "green_rc=$?"
  grep -E '^test |^test result' /home/anvil/green.out
  echo "green_summary=$(grep -E '^test result' /home/anvil/green.out | head -1)"

  # Step 3: the uring gate.
  cargo fmt --all --check; echo "gate_fmt=$?"
  cargo clippy --locked --all-targets -- -D warnings; echo "gate_clippy_uring=$?"
  cargo clippy --locked --all-targets --features force-mio -- -D warnings; echo "gate_clippy_mio=$?"
  cargo clippy --locked --all-targets --features tls-buffered -- -D warnings; echo "gate_clippy_tls=$?"
  RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ringline; echo "gate_doc=$?"
  cargo test --locked --all; echo "gate_test_uring=$?"
} 2>&1 | tee /home/anvil/verify.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
fail=0
grep -q "^gate_backend=0" verify.log || { echo "FAIL gate_backend"; fail=1; }
# Red: the run fails, with exactly the two pinning tests failing.
grep -q "^red_rc=[1-9]" verify.log || { echo "FAIL red: the tests passed on the unfixed code"; fail=1; }
red=$(grep -oE "^red_summary=.*" verify.log)
echo "$red"
echo "$red" | grep -qE "6 passed; 2 failed" || { echo "FAIL red: expected 6 passed; 2 failed"; fail=1; }
# Green: all eight pass.
grep -q "^green_rc=0" verify.log || { echo "FAIL green"; fail=1; }
green=$(grep -oE "^green_summary=.*" verify.log)
echo "$green"
echo "$green" | grep -qE "8 passed; 0 failed" || { echo "FAIL green: expected 8 passed; 0 failed"; fail=1; }
for gate in gate_fmt gate_clippy_uring gate_clippy_mio gate_clippy_tls gate_doc gate_test_uring; do
  if ! grep -q "^${gate}=0" verify.log; then
    got=$(grep -oE "^${gate}=[0-9]+" verify.log | head -1)
    echo "FAIL ${gate}: ${got:-never reached}"
    fail=1
  else
    echo "ok   ${gate}"
  fi
done
exit $fail
'''
