# Experiment B, uncontended (docs/send-admission-design.md, section 4): what
# send_admitted costs a saturated worker against send_nowait.
# Generated by send-admission-b-echo-gen.py; edit that.
#
# Server guest on hv02 (z1, 24 vCPU), bench-server with ONE worker, pinned by
# ringline to CPU 0. Client guest on hv01 (z2, 56 vCPU), {client_threads}
# threads. The X710 LAG between them, {msg_size} B messages, {clients}
# connections.
#
# Arms (label: bench-server --echo-mode and flags):
#   bytes-nowait            with_bytes, then send, completion dropped
#                           (send_nowait before 0.7.0-alpha.141)
#   bytes-admitted          with_bytes, then send_admitted, completion dropped
#   bytes-admitted-timeout  with_bytes, then section 2's example: send_admitted
#                           under timeout(1 s), then the completion under
#                           timeout(1 s)
#   bytes-admitted-await    with_bytes, then send_admitted, then the
#                           completion awaited with no timeout
#   bytes-nowait-defer      bytes-nowait with --defer-recv-arm
#
# Cells: 0=warmup:bytes-nowait, 1=rep1:bytes-nowait, 2=rep1:bytes-admitted, 3=rep1:bytes-admitted-timeout, 4=rep1:bytes-admitted-await, 5=rep1:bytes-nowait-defer, 6=rep2:bytes-admitted, 7=rep2:bytes-admitted-timeout, 8=rep2:bytes-admitted-await, 9=rep2:bytes-nowait-defer, 10=rep2:bytes-nowait, 11=rep3:bytes-admitted-timeout, 12=rep3:bytes-admitted-await, 13=rep3:bytes-nowait-defer, 14=rep3:bytes-nowait, 15=rep3:bytes-admitted, 16=rep4:bytes-admitted-await, 17=rep4:bytes-nowait-defer, 18=rep4:bytes-nowait, 19=rep4:bytes-admitted, 20=rep4:bytes-admitted-timeout
# Each cell runs its own server on port 7900+k and two windows:
#   closed  one request in flight per connection, which saturates the worker.
#           Statistic: the worker thread's CPU time per operation, from
#           /proc/<pid>/task/<tid>/schedstat over the window (warm-up + 1 s
#           to the end - 1 s), divided by the client's operations.
#   open    {open_rate} requests/s offered, about half the closed-loop rate.
#           Statistic: the client's p99, measured from each request's
#           scheduled send time.
name = "send-admission B echo controls{run}"

[params]
bins_artifact  = "REPLACE-WITH-ARTIFACT-ID"
run            = "1"
image          = "debian-13-6.12"
server_ip      = "172.31.0.1"
client_ip      = "172.31.0.2"
client_threads = "16"
clients        = "256"
msg_size       = "256"
warmup         = "5"
duration       = "20"
open_rate      = "55000"

# -- server: hv02 --------------------------------------------------------------

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/* || exit 1
mkdir -p logs
cat /etc/anvil-image.json 2>/dev/null || cat /etc/anvil-instance.json; echo
uname -r; nproc
cat /sys/devices/system/clocksource/clocksource0/current_clocksource
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.core.rmem_max=134217728 net.core.wmem_max=134217728
ip -4 -brief addr show
( cd out && sha256sum * )
got=$(./out/bench-server --print-backend)
[ "$got" = io_uring ] || { echo "BACKEND MISMATCH: bench-server is $got"; exit 1; }
echo "run={run} backend=$got"
'''

# cell 0: warmup bytes-nowait
[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "srv0"
payload = "exec /home/anvil/out/bench-server --runtime ringline --echo-mode bytes-nowait --addr {server_ip}:7900 --workers 1 --msg-size {msg_size} > /home/anvil/logs/srv0-bytes-nowait.log 2>&1"

[[jobs.steps]]
type = "barrier"
name = "ready0-closed"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
payload = '''
pid=$(systemctl show -p MainPID --value srv0)
tid=$(ps -L -o tid=,comm= -p "$pid" | awk '$2=="rl-work-0" {print $1}')
[ -n "$tid" ] || { echo "no rl-work-0 thread in pid $pid"; ps -L -o tid,comm,psr -p "$pid"; exit 1; }
echo "cell=0 tag=warmup arm=bytes-nowait window=closed pid=$pid worker_tid=$tid $(grep Cpus_allowed_list /proc/$pid/task/$tid/status | tr -d '\t')"
sleep $(({warmup} + 1))
a=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t0=$(date +%s%N)
sleep $(({duration} - 2))
b=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t1=$(date +%s%N)
echo "WORKER cell=0 tag=warmup arm=bytes-nowait window=closed cpu_ns=$((b - a)) wall_ns=$((t1 - t0))"
'''

[[jobs.steps]]
type = "barrier"
name = "done0-closed"
timeout = 1800

[[jobs.steps]]
type = "barrier"
name = "ready0-open"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
payload = '''
pid=$(systemctl show -p MainPID --value srv0)
tid=$(ps -L -o tid=,comm= -p "$pid" | awk '$2=="rl-work-0" {print $1}')
[ -n "$tid" ] || { echo "no rl-work-0 thread in pid $pid"; ps -L -o tid,comm,psr -p "$pid"; exit 1; }
echo "cell=0 tag=warmup arm=bytes-nowait window=open pid=$pid worker_tid=$tid $(grep Cpus_allowed_list /proc/$pid/task/$tid/status | tr -d '\t')"
sleep $(({warmup} + 1))
a=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t0=$(date +%s%N)
sleep $(({duration} - 2))
b=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t1=$(date +%s%N)
echo "WORKER cell=0 tag=warmup arm=bytes-nowait window=open cpu_ns=$((b - a)) wall_ns=$((t1 - t0))"
'''

[[jobs.steps]]
type = "barrier"
name = "done0-open"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload = '''
sudo systemctl kill -s INT srv0
for i in $(seq 1 50); do systemctl is-active --quiet srv0 || break; sleep 0.2; done
ss -ltnH "sport = :7900" | grep -q . && { echo "port 7900 still listening"; exit 1; }
echo "SERVER cell=0 tag=warmup arm=bytes-nowait $(grep bytes_send_failed /home/anvil/logs/srv0-bytes-nowait.log)"
'''

