# -- client: hv01 --------------------------------------------------------------

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/* || exit 1
mkdir -p results
cat /etc/anvil-image.json 2>/dev/null || cat /etc/anvil-instance.json; echo
uname -r; nproc
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 net.ipv4.ip_local_port_range="1024 65535"
ip -4 -brief addr show
ping -c 2 -W 2 {server_ip} || echo "WARN: server address not reachable yet"
'''

# cell 0: warmup bytes-nowait closed
[[jobs.steps]]
type = "barrier"
name = "ready0-closed"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload = '''
cd /home/anvil
ulimit -n 500000
for i in $(seq 1 100); do (exec 3<>/dev/tcp/{server_ip}/7900) 2>/dev/null && { exec 3>&-; break; }; sleep 0.1; done
./out/bench-client --runtime ringline --addr {server_ip}:7900 --clients {clients} --msg-size {msg_size} --threads {client_threads} --warmup {warmup} --duration {duration} > results/c0-warmup-bytes-nowait-closed.json 2> results/c0-warmup-bytes-nowait-closed.log
echo "CELL k=0 tag=warmup arm=bytes-nowait window=closed rc=$? $(tail -1 results/c0-warmup-bytes-nowait-closed.log)"
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "done0-closed"
timeout = 1800

