# Spike for docs/listeners-and-accept-design.md open question 1:
# does a SO_REUSEPORT listener that a BPF selection program never picks still
# accrue a backlog? If it does, "take a worker out of the accept rotation"
# (tier 2) does not work: connections keep queueing on the socket we stopped
# serving, and closing it to drain would RESET them.
name = "ringline reuseport steering spike"

[[jobs]]
name = "spike"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "debian-13-6.12"
slots = 1
memory_gib = 4
ports = 0
gpu = false
payload_timeout = 900
artifacts = ["/home/anvil/spike.log"]
upload = true
payload = '''
set -uo pipefail
# The image family moves; record which image, rustc and kernel ran.
cat /etc/anvil-instance.json 2>/dev/null; echo
rustc -V 2>/dev/null; uname -r
cd /home/anvil
{
  echo "== kernel =="
  uname -srm
  head -2 /etc/os-release
  echo
  echo "== build =="
  echo "" | base64 -d > reuseport_spike.c
  sha256sum reuseport_spike.c
  gcc -O2 -Wall -Wextra -o reuseport_spike reuseport_spike.c || exit 1
  echo
  echo "== A: CBPF selects index 0 — listeners 1..3 are never chosen =="
  echo "   if they still show a Recv-Q or accept anything, exclusion does NOT"
  echo "   stop queueing, and tier 2 of the design needs rethinking."
  ./reuseport_spike 24601 0 || exit 1
  echo
  echo "== B: CBPF selects index 2 — re-attach steers elsewhere =="
  ./reuseport_spike 24602 2 || exit 1
  echo
  echo "== C: no BPF, kernel 4-tuple hash, for contrast =="
  ./reuseport_spike 24603 -1 || exit 1
} 2>&1 | tee /home/anvil/spike.log
rc=${PIPESTATUS[0]}
echo "spike_status=$rc" | tee -a /home/anvil/spike.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
grep -q "spike_status=0" spike.log || { echo "spike payload failed"; exit 1; }
echo "spike completed"
'''
