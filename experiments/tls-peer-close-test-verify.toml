# Red-then-green run for #889: a TLS close_notify on a TCP stream the peer
# keeps open is seen on io_uring only when a receive reads it, and
# `a_reply_after_the_peers_close_notify_reaches_the_client` asserted that the
# server's task saw it while asleep on a timer.
#
# macOS cannot run the io_uring path, so this runs in an ephemeral VM on the
# `validation` agent, never by a login to a rig host (CLAUDE.md, "Verifying
# io_uring code").
#
# `red_ref` is the tests-only commit: the client sends its close_notify 100 ms
# after its request, so it arrives while the server's task sleeps. Step 1 runs
# the test there 5 times and expects every run to fail. Step 2 runs it at the
# branch head, where the task reads to the close_notify before its timer, 20
# times and expects every run to pass. Step 3 is the uring gate.
#
#   systemslab submit experiments/tls-peer-close-test-verify.toml
name = "ringline tls peer-close test verify ({branch})"

[params]
branch = "fix-tls-peer-close-test"
repo   = "https://github.com/brayniac/ringline"
red_ref = "17c0578086385c49a439980f80ef5a5efaa28a15"
test   = "a_reply_after_the_peers_close_notify_reaches_the_client"

[[jobs]]
name = "verify"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "debian-13-6.12"
slots = 1
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 7200
artifacts = ["/home/anvil/verify.log"]
upload = true
payload = '''
set -uo pipefail
cat /etc/anvil-instance.json 2>/dev/null; echo
rustc -V 2>/dev/null; uname -r
cd /home/anvil
{
  uname -srm
  echo "io_uring_disabled=$(sysctl -n kernel.io_uring_disabled 2>/dev/null || echo unset)"
  cargo --version

  git clone -q {repo} src && git -C src checkout -q {branch}
  cd src && git log --oneline -3

  ulimit -Sn 65536
  echo "nofile_soft=$(ulimit -Sn)"

  # This must be the io_uring build; a mio build would run none of the code
  # under test and report green for it.
  cargo build --locked -q -p ringline-bench --bin bench-server
  got=$(./target/debug/bench-server --print-backend)
  [ "$got" = "io_uring" ] || { echo "BACKEND MISMATCH: $got"; echo "gate_backend=1"; exit 1; }
  echo "gate_backend=0 (backend=$got)"

  # Step 1: the test at the tests-only commit, on the unchanged server, five
  # times. Not piped: a piped cargo reports the pipe's status.
  git checkout -q {red_ref} && git log --oneline -1
  cargo test --locked -p ringline --test tls_echo --no-run -q > /dev/null 2>&1
  for i in 1 2 3 4 5; do
    cargo test --locked -p ringline --test tls_echo -- --exact {test} > /home/anvil/red.out 2>&1
    echo "red_run=$i rc=$?"
    grep -E '^test result|left:|right:' /home/anvil/red.out
  done
  git checkout -q {branch} && git log --oneline -1

  # Step 2: the same test on the branch head, twenty times.
  cargo test --locked -p ringline --test tls_echo --no-run -q > /dev/null 2>&1
  for i in $(seq 1 20); do
    cargo test --locked -p ringline --test tls_echo -- --exact {test} > /home/anvil/green.out 2>&1
    echo "green_run=$i rc=$? $(grep -E '^test result' /home/anvil/green.out | head -1)"
  done

  # Step 3: the uring gate.
  cargo fmt --all --check; echo "gate_fmt=$?"
  cargo clippy --locked --all-targets -- -D warnings; echo "gate_clippy_uring=$?"
  cargo clippy --locked --all-targets --features force-mio -- -D warnings; echo "gate_clippy_mio=$?"
  cargo clippy --locked --all-targets --features tls-buffered -- -D warnings; echo "gate_clippy_tls=$?"
  RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ringline; echo "gate_doc=$?"
  cargo test --locked --all; echo "gate_test_uring=$?"
} 2>&1 | tee /home/anvil/verify.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
fail=0
grep -q "^gate_backend=0" verify.log || { echo "FAIL gate_backend"; fail=1; }
# Red: all five runs fail, each with the one test failing.
n=$(grep -cE "^red_run=[0-9]+ rc=[1-9]" verify.log)
f=$(grep -cE "^test result: FAILED\. 0 passed; 1 failed" verify.log)
echo "red: $n of 5 runs failed; $f failure summaries"
[ "$n" = 5 ] && [ "$f" = 5 ] || { echo "FAIL red: expected 5 failing runs"; fail=1; }
# Green: all twenty runs pass, each with the one test passing.
n=$(grep -cE "^green_run=[0-9]+ rc=0 test result: ok. 1 passed; 0 failed" verify.log)
echo "green: $n of 20 runs passed"
[ "$n" = 20 ] || { echo "FAIL green: expected 20 passing runs"; fail=1; }
for gate in gate_fmt gate_clippy_uring gate_clippy_mio gate_clippy_tls gate_doc gate_test_uring; do
  if ! grep -q "^${gate}=0" verify.log; then
    got=$(grep -oE "^${gate}=[0-9]+" verify.log | head -1)
    echo "FAIL ${gate}: ${got:-never reached}"
    fail=1
  else
    echo "ok   ${gate}"
  fi
done
exit $fail
'''
