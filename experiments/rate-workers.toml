# Rate x workers: the rate-vs-latency curve per worker count, and a collapse test.
#
# DERIVED from experiments/min-complete-sweep.toml -- matrix block and the rate/
# workers params only, so the measurement scaffolding is identical to the 15 runs
# already taken at 600k.
#
# WHY. Everything measured so far sits at one offered rate, 600k. The coalescing
# effect is a function of per-worker SERVICE rate, not of worker count, so the
# whole shape should move with offered rate -- and if it does, the knee is not a
# property of "4 workers" at all.
#
# ops/s PER WORKER for each cell:
#
#            w2        w4        w8       w16
#   300k    150k       75k     37.5k    18.75k
#   600k    300k      150k       75k     37.5k
#   1.2M    600k      300k      150k       75k
#
# PREDICTION, written before the run. CQE/op collapses onto per-worker rate and
# is independent of how that rate was reached:
#
#   150k/wkr  -> (300k,w2), (600k,w4), (1.2M,w8)  should all give CQE/op ~0.87
#   75k/wkr   -> (300k,w4), (600k,w8), (1.2M,w16) should all give CQE/op ~1.9
#   300k/wkr  -> (600k,w2), (1.2M,w4)             should agree with each other
#   37.5k/wkr -> (300k,w8), (600k,w16)            should agree with each other
#
# Measured anchors on this build: (600k,w4) = 0.86-0.94 over four reps, and
# (600k,w8) = 1.64-1.95 over six. A collapse means the diagonals land on those.
# A failure means worker count matters independently of per-worker rate, and the
# "read the shape, not the row" advice in the design doc is wrong.
#
# The noise should collapse too, which is a second prediction: p99 at (600k,w4)
# (150k/wkr) reproduced to 5.8% over four reps, while (600k,w8) (75k/wkr) spanned
# 401% over six. So the low-per-worker-rate cells are the unreliable ones, and
# single-run p99 in those cells should not be read as a result.
#
# VALIDITY GATE. Every arm is OPEN loop at a fixed offered rate, so a saturated
# arm does not necessarily miss its target -- it grows a queue instead. Achieved
# rate is therefore NOT a sufficient saturation test, which this sweep proved the
# hard way: (1.2M, w8) served 99.8% of offered while running a 150 ms p50 and
# ~704 requests outstanding per connection. It passed a >=95% gate and was
# nowhere near a usable operating point.
#
# Gate on QUEUE DEPTH instead, via Little's law: outstanding = offered_rate x p50,
# and divided by the connection count that gives requests in flight per
# connection. Under ~1 means the worker is keeping up; several means a queue;
# hundreds means collapse. Read it alongside worker CPU from the Rezolus
# per-vCPU recording -- a worker below 1.00 cannot be the queue's cause.
#
# So: discard the latency of any arm that misses its offered rate AND treat any
# arm above a few requests outstanding per connection as a capacity measurement
# rather than a point on a cost curve.
#
# Client-side ceiling is the other risk: the client is 8 threads for every arm,
# held constant for comparability with the 600k runs already taken. If the 1.2M
# row uniformly undershoots, suspect the CLIENT before the server and rerun that
# row with more threads rather than reading it as server saturation.
#
name = "rw r{rate} w{workers} rep{rep}"

[matrix]
context_name = "ringline: rate x workers, and does per-worker rate govern? (#443)"
rate = ["300000", "600000", "1200000"]
workers = ["2", "4", "8", "16"]
rep = ["1"]

[params]
# Update to the artifact id of a fresh `ringline min-complete build`.
bins_artifact = "01a0e921-ca58-731a-e957-3bf6e46b3e78"
image         = "debian-13-6.12"
server_ip     = "172.31.0.1"
client_ip     = "172.31.0.2"
port          = "7878"
clients       = "256"
msg_size      = "64"
warmup        = "5"
duration      = "90"

# ── server: hv02 ───────────────────────────────────────────────────────────

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535
nproc
uname -r
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "ringline-server"
payload = '''
exec /home/anvil/out/bench-server --runtime ringline --addr {server_ip}:{port} \
  --workers {workers} --msg-size {msg_size} --accept-mode merged \
  --echo-mode forward \
  --metrics-out /home/anvil/metrics.json
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/cpu.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil
mkdir -p cpu
echo "rate={rate} workers={workers} rep={rep}" > cpu/arm.txt

# One window over the steady state: there is no readmit here, so the before/
# after pair the park runs needed collapses to a single span.
sleep 12
grep '^cpu[0-9]' /proc/stat > cpu/stat-open
sleep 70
grep '^cpu[0-9]' /proc/stat > cpu/stat-close

# Sample every cpu and score it without assuming a worker->cpu mapping. The
# guest enumerates SMT siblings adjacently, so ringline's SMT-aware pinning
# puts worker W on cpu 2W; a cpu0..cpu7 window would miss half the workers.
# That mistake cost a whole round of park runs.
awk '
  FNR==NR { for (i=2;i<=NF;i++) b[$1,i]=$i; next }
  {
    tot=0; for (i=2;i<=NF;i++) tot += $i - b[$1,i]
    idle=($5-b[$1,5])+($6-b[$1,6])
    pct = (tot>0 ? 100.0*(tot-idle)/tot : 0)
    printf "%s %.1f\n", $1, pct
    sum += pct; if (pct > 50) loaded++
  }
  END { printf "SUMMARY loaded_cores=%d total_busy_pct=%.1f\n", loaded+0, sum+0 }
' cpu/stat-open cpu/stat-close | tee cpu/per-core.txt

cp /home/anvil/metrics.json cpu/ 2>/dev/null || echo "no metrics.json yet" >> cpu/per-core.txt
tar czf /home/anvil/cpu.tgz -C /home/anvil cpu
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/metrics.json"]
payload = '''
# SIGTERM so the server runs its shutdown path and dumps counters.
sudo systemctl stop ringline-server 2>/dev/null || true
sleep 2
echo "--- counters ---"
python3 - <<'EOF'
import json,sys
m = dict()
for e in json.load(open("/home/anvil/metrics.json")):
    m[(e["name"], e.get("op"))] = e["value"]
def g(n, o):
    return m.get(("ringline/" + n, o))
acc = g("connections", "accepted")
for k in ("accepted", "adopted", "park_started", "park_completed"):
    print("%-16s= %s" % (k, g("connections", k)))
print("%-16s= %s" % ("bytes_received", g("bytes", "received")))
# The run has to prove it carried load before any ratio computed from it means
# anything. accepted==1 is the /dev/tcp reachability probe alone -- the
# signature of a client that never started, which made six park runs unreadable.
want = {clients}
if acc is None or acc < want:
    print("FATAL: accepted=%s < clients=%s: no workload, counters uninterpretable" % (acc, want))
    sys.exit(1)
print("workload OK: accepted=%s >= clients=%s" % (acc, want))
EOF
rc=$?
exit $rc
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

# ── client: hv01 ───────────────────────────────────────────────────────────

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo prlimit --nofile=1000000 --pid $$ 2>/dev/null || true
echo "fd soft=$(ulimit -Sn) hard=$(ulimit -Hn) clients={clients}"
ip -4 -brief addr show
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/client.log"]
payload = '''
set -uo pipefail
cd /home/anvil
for i in $(seq 1 120); do
  (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; echo "server reachable after ${i}s"; break; }
  sleep 1
done
# Open loop at a fixed offered rate: the question is the cost per operation at
# constant throughput, so the load must not adapt to the server's latency the
# way a closed loop would.
./out/bench-client --runtime ringline --addr {server_ip}:{port} --clients {clients} \
  --threads 8 --msg-size {msg_size} --warmup {warmup} --duration {duration} \
  --open --rate {rate} \
  2>&1 | tee /home/anvil/client.log
rc=${PIPESTATUS[0]}
echo "client_rc=${rc}" | tee -a /home/anvil/client.log
# A run with no load must not be reportable as a result.
exit "$rc"
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
