# Experiment E: Experiment D's cells with replies over TLS. Large replies are
# sent whole or in pieces, with or without the gate on socket room, under an
# admission order, in workload U, W1, W2, W4 or W5. The spec is D's
# (send-admission-d.toml, stored in D's SystemsLab experiments), with tls
# added and the experimental orders' small-slot parameters removed.
#
# One cell and one arm per experiment, in one guest on {host}:
# admission-server (one worker, pinned to CPU 0) and admission-load (CPUs 2
# and up) over loopback, as in send-admission-c0.toml. net.ipv4.tcp_wmem is
# capped at {tcp_wmem_max} B. net.core.rmem_max and wmem_max are raised to
# {core_mem_max} B, so that an SO_RCVBUF the load sets takes effect.
#
# An arm is tls, order, budget, stream_piece, stream_gate, slot_size and
# pool_slots. A cell is the rest of the parameters; the cells and arms, with
# their values, are in send-admission-e-matrix.json. The defaults are W1,
# plaintext, strict order, whole replies.
#
# Parameters, beyond send-admission-c0.toml's (see there for the rest):
#   tls             on: the server serves TLS with a certificate it generates
#                   (--tls, written to results/cert.pem), and every load
#                   connection speaks TLS and trusts it; slot_size must then
#                   be at least 16413
#   order           strict or budget (O7w: SendAdmissionOrder::Budget, whose
#                   waiter must be on a connection with nothing queued)
#   stream_piece    the server sends a large reply of more than this many
#                   bytes in pieces of this many bytes; 0 sends it whole
#   stream_gate     on: before each piece the server waits until the socket
#                   reports room (SendHalf::writable); off: it does not
#   closed_loop     with N > 0 the load runs only workload U: one connection,
#                   N requests for large_size bytes, each written when the
#                   reply before it has been read, after closed_warmup
#                   uncounted ones; 0 runs the episodes
#   closed_warmup   replies the closed loop reads before it counts
#   head_rcvbuf     SO_RCVBUF on the head's socket and on the closed loop's,
#                   set before the connect (Linux doubles it); 0 leaves it to
#                   the kernel
#   core_mem_max    net.core.rmem_max and net.core.wmem_max
#   large_size      as in C0; 0 runs episodes with no head
#   ss_interval     seconds between ss -tmi samples
#
# Measured, beyond C0's: per large reply, its pieces, those that waited for
# room, how it ended, its server-side time from scheduled time to its last
# piece settling, and the fewest free slots of the pool's main region during
# it; every 10 ms sample of those free slots; aborts by cause; per head and
# per drainer reply, whether the client read all of it and its time from
# request to last byte in microseconds; for U, each counted reply's time and
# the SO_RCVBUF the kernel reports. The job also records the worker thread's
# CPU time from /proc/PID/task/TID/schedstat over the load's run (WORKER
# line), /proc/net/sockstat and TcpExtTCPMemoryPressures before and after
# the run, and, every ss_interval seconds during it, ss -tmi of the latest
# episode's first stalled peer, first drainer and head, from the server's
# side, picked by the local ports the load writes to ports.txt (SS lines in
# ss.log). The image's own net.core.rmem_max and wmem_max are recorded before
# they are raised (core-mem-image.txt), and the paths of the tools the
# payload calls in tools.txt. If the server has no rl-work-0 thread to read
# the CPU of, the job stops the server without running the load, and prints
# "no rl-work-0 thread", the RUN line with load_rc=-1 and STATUS.
#
# The job prints a RUN line with every parameter that varies between cells and
# arms, the WORKER line, then the LOAD JSON line and a SERVER line without the
# per-large-reply records and the free-slot samples (server-summary.json),
# and last a STATUS line with the load's exit code. The payload exits 0
# whatever the load's exit code, so that the job keeps its artifacts;
# send-admission-e-report.py counts a run whose results it cannot read as
# failed. results.tgz holds load.json, the full server.json,
# server-summary.json, both logs, ports.txt, ss.log, worker.txt, tools.txt,
# cert.pem under tls, and the sysctl, sockstat and nstat files.
name = "send-admission E {workload} tls-{tls} {order} p{stream_piece} gate-{stream_gate} k{stall_peers} rep{rep}"

[params]
bins_artifact  = "REPLACE-WITH-ARTIFACT-ID"
workload       = "W1"
small_send     = "admitted"
tls            = "off"
order          = "strict"
budget         = "32"
stream_piece   = "0"
stream_gate    = "off"
host           = "hv03"
admit_ms       = "1000"
settle_ms      = "1000"
pipeline       = "16"
rep            = "1"
image          = "debian-13-6.12"
warmup         = "4"
duration       = "40"
episode_ms     = "4000"
small_conns    = "16"
small_rate     = "2000"
small_size     = "256"
stall_peers    = "3"
stall_size     = "3145728"
large_size     = "7340032"
large_delay_ms = "200"
head_rcvbuf    = "0"
closed_loop    = "0"
closed_warmup  = "10"
slow_conns     = "0"
slow_rate      = "0"
slow_size      = "4096"
slow_read_bps  = "0"
slow_rcvbuf    = "4096"
drainers       = "0"
drain_size     = "2097152"
drain_read_bps = "0"
drain_rcvbuf   = "4096"
outside_conns  = "0"
outside_rate   = "0"
outside_size   = "256"
tcp_wmem_max   = "1048576"
core_mem_max   = "16777216"
ss_interval    = "1"
pool_slots     = "512"
slot_size      = "16384"

[[jobs]]
name = "vm"
tags = ["host:{host}"]

[[jobs.steps]]
uses = "anvil-vm"
[jobs.steps.with]
shape = "auto.c"
image = "{image}"
memory_gib = 8
gpu = false
boot_timeout = 600
payload_timeout = 1200
upload = true
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
artifacts = ["/home/anvil/results.tgz"]
payload = '''
set -uo pipefail
export PATH="$PATH:/usr/sbin:/sbin"
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/* || exit 1
mkdir -p results
for t in sysctl ss nstat taskset ps; do command -v $t || echo "missing $t"; done | tee results/tools.txt
cat /etc/anvil-image.json 2>/dev/null || cat /etc/anvil-instance.json; echo
uname -r; nproc
( cd out && sha256sum admission-server admission-load )
ulimit -n 65536
cat /proc/sys/net/core/rmem_max /proc/sys/net/core/wmem_max | tee results/core-mem-image.txt
sudo sysctl -w net.ipv4.tcp_wmem="4096 16384 {tcp_wmem_max}"
sudo sysctl -w net.core.rmem_max={core_mem_max} net.core.wmem_max={core_mem_max}
sudo sysctl net.ipv4.tcp_rmem net.ipv4.tcp_wmem net.ipv4.tcp_mem net.core.rmem_max net.core.wmem_max | tee results/sysctl.txt
gate=""
if [ "{stream_gate}" = "on" ]; then gate="--stream-gate"; fi
srvtls=""; loadtls=""
if [ "{tls}" = "on" ]; then srvtls="--tls --tls-cert-out results/cert.pem"; loadtls="--tls --tls-ca results/cert.pem"; fi
runline="RUN workload={workload} tls={tls} small_send={small_send} order={order} budget={budget} stream_piece={stream_piece} stream_gate={stream_gate} host={host} admit_ms={admit_ms} settle_ms={settle_ms} pipeline={pipeline} tcp_wmem_max={tcp_wmem_max} core_mem_max={core_mem_max} small_conns={small_conns} small_rate={small_rate} small_size={small_size} stall_peers={stall_peers} stall_size={stall_size} large_size={large_size} head_rcvbuf={head_rcvbuf} closed_loop={closed_loop} closed_warmup={closed_warmup} slow_conns={slow_conns} slow_rate={slow_rate} slow_size={slow_size} slow_read_bps={slow_read_bps} slow_rcvbuf={slow_rcvbuf} drainers={drainers} drain_size={drain_size} drain_read_bps={drain_read_bps} drain_rcvbuf={drain_rcvbuf} episode_ms={episode_ms} duration={duration} outside_conns={outside_conns} outside_rate={outside_rate} outside_size={outside_size} ss_interval={ss_interval} pool_slots={pool_slots} slot_size={slot_size} rep={rep}"
cat /proc/net/sockstat > results/sockstat-before.txt
nstat -az TcpExtTCPMemoryPressures > results/nstat-before.txt 2>&1 || true
last=$(($(nproc) - 1))
./out/admission-server --addr 127.0.0.1:7979 --small-send {small_send} --order {order} --budget {budget} --admit-limit-ms {admit_ms} --settle-limit-ms {settle_ms} --pipeline {pipeline} --pool-slots {pool_slots} --slot-size {slot_size} --stream-piece {stream_piece} $gate $srvtls --summary-file results/server-summary.json --cpu 0 > results/server.json 2> results/server.log &
srv=$!
for i in $(seq 1 100); do (exec 3<>/dev/tcp/127.0.0.1/7979) 2>/dev/null && { exec 3>&-; break; }; sleep 0.1; done
tid=$(ps -L -o tid=,comm= -p "$srv" | grep -w rl-work-0 | head -n 1 | sed 's/^ *//; s/ .*//' || true)
echo "server pid=$srv worker_tid=$tid"
if [ -z "$tid" ]; then
  echo "no rl-work-0 thread in pid $srv"; ps -L -o tid,comm -p "$srv"
  kill -INT $srv; wait $srv
  echo "$runline load_rc=-1"
  tar czf results.tgz results
  echo "STATUS load_rc=-1 no rl-work-0 thread"
  exit 0
fi
sched=/proc/$srv/task/$tid/schedstat
: > results/ports.txt
rm -f results/load.done
(
  while [ ! -e results/load.done ]; do
    t=$(date +%s%N)
    for kind in stall drain head; do
      port=$(grep " $kind 0 " results/ports.txt | tail -n 1 | cut -d' ' -f5 || true)
      if [ -n "$port" ]; then
        echo "SS $t $kind $port $(ss -tmiHO "( sport = :7979 and dport = :$port )" | tr '\n' ' ')"
      fi
    done
    sleep {ss_interval}
  done
) > results/ss.log 2>&1 &
sampler=$!
cpu0=$(cut -d' ' -f1 "$sched" 2>/dev/null || echo 0); wall0=$(date +%s%N)
taskset -c 2-$last ./out/admission-load --addr 127.0.0.1:7979 --duration {duration} --warmup {warmup} --within-ms {admit_ms} --episode-ms {episode_ms} --small-conns {small_conns} --small-rate {small_rate} --small-size {small_size} --stall-peers {stall_peers} --stall-size {stall_size} --large-size {large_size} --large-delay-ms {large_delay_ms} --head-rcvbuf {head_rcvbuf} --closed-loop {closed_loop} --closed-warmup {closed_warmup} --slow-conns {slow_conns} --slow-rate {slow_rate} --slow-size {slow_size} --slow-read-bps {slow_read_bps} --slow-rcvbuf {slow_rcvbuf} --drainers {drainers} --drain-size {drain_size} --drain-read-bps {drain_read_bps} --drain-rcvbuf {drain_rcvbuf} --outside-conns {outside_conns} --outside-rate {outside_rate} --outside-size {outside_size} --ports-file results/ports.txt $loadtls > results/load.json 2> results/load.log
rc=$?
cpu1=$(cut -d' ' -f1 "$sched" 2>/dev/null || echo 0); wall1=$(date +%s%N)
touch results/load.done
wait $sampler
cat /proc/net/sockstat > results/sockstat-after.txt
nstat -az TcpExtTCPMemoryPressures > results/nstat-after.txt 2>&1 || true
kill -INT $srv; wait $srv
echo "WORKER cpu_ns=$((cpu1 - cpu0)) wall_ns=$((wall1 - wall0)) tid=$tid" | tee results/worker.txt
echo "$runline load_rc=$rc"
echo "LOAD $(cat results/load.json)"
echo "SERVER $(cat results/server-summary.json)"
cat results/sockstat-before.txt results/sockstat-after.txt results/nstat-before.txt results/nstat-after.txt
tail -3 results/server.log results/load.log
tar czf results.tgz results
echo "STATUS load_rc=$rc"
exit 0
'''
