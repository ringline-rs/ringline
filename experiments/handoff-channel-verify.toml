# Red-then-green run for #780: the accept and park hand-off channels are
# `std::sync::mpsc` channels, whose receiver drops what is queued when it
# drops, plus the uring gate on the result.
#
# macOS cannot type-check the io_uring path, so the uring driver's use of the
# channels is checked here, in an ephemeral VM on the `validation` agent,
# never by a login to a rig host (CLAUDE.md, "Verifying io_uring code").
#
# `red_ref` is the first commit of `flake-780`: the `handoff` module as aliases
# of the crossbeam channel the code used, with the test of the property. Step 1
# runs the test there and expects `1 failed` (`left: 2, right: 1`: the queued
# message outlived the receiver). Step 2 runs it at the branch head, on the
# `std` channel, and expects `0 failed`. Step 3 runs the worker exit tests 30
# times at the head, as a check that the switch broke no exit path; the race
# behind #780 was not reproduced in 150 runs before the change, so a clean
# loop here is not evidence about the race. Step 4 is the uring gate.
#
# Prediction: red_rc non-zero with `1 failed`; green_rc 0 with `0 failed`;
# exit_fail_runs=0; every gate 0.
#
#   systemslab submit experiments/handoff-channel-verify.toml
name = "ringline handoff-channel verify ({branch})"

[params]
branch = "flake-780"
repo   = "https://github.com/brayniac/ringline"
red_ref = "93e527d82d8f01cdfa6b5d1c8e30c80a224e6c13"
tests  = "handoff"

[[jobs]]
name = "verify"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "debian-13-6.12"
slots = 1
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 7200
artifacts = ["/home/anvil/verify.log"]
upload = true
payload = '''
set -uo pipefail
cat /etc/anvil-instance.json 2>/dev/null; echo
rustc -V 2>/dev/null; uname -r
cd /home/anvil
{
  uname -srm
  echo "io_uring_disabled=$(sysctl -n kernel.io_uring_disabled 2>/dev/null || echo unset)"
  cargo --version

  git clone -q {repo} src && git -C src checkout -q {branch}
  cd src && git log --oneline -3

  ulimit -Sn 65536
  echo "nofile_soft=$(ulimit -Sn)"

  # This must be the io_uring build; a mio build would run none of the code
  # under test and report green for it.
  cargo build --locked -q -p ringline-bench --bin bench-server
  got=$(./target/debug/bench-server --print-backend)
  [ "$got" = "io_uring" ] || { echo "BACKEND MISMATCH: $got"; echo "gate_backend=1"; exit 1; }
  echo "gate_backend=0 (backend=$got)"

  # Step 1: the property test on the crossbeam channel. Not piped: a piped
  # cargo reports the pipe's status.
  git checkout -q {red_ref} && git log --oneline -1
  cargo test --locked -p ringline --lib -- {tests} > /home/anvil/red.out 2>&1
  echo "red_rc=$?"
  grep -E '^test .*FAILED|^test result|panicked|left:|right:' /home/anvil/red.out
  echo "red_summary=$(grep -E '^test result' /home/anvil/red.out | head -1)"
  git checkout -q {branch} && git log --oneline -1

  # Step 2: the same test on the std channel.
  cargo test --locked -p ringline --lib -- {tests} > /home/anvil/green.out 2>&1
  echo "green_rc=$?"
  grep -E '^test .*FAILED|^test result' /home/anvil/green.out
  echo "green_summary=$(grep -E '^test result' /home/anvil/green.out | head -1)"

  # Step 3: the worker exit tests, 30 runs.
  fails=0
  for i in $(seq 1 30); do
    if ! cargo test --locked -p ringline --lib -- worker_exit_tests acceptor::tests > /home/anvil/exit.$i.out 2>&1; then
      fails=$((fails+1)); echo "exit run $i FAILED"; grep -E 'FAILED|panicked|Hung|Closed' /home/anvil/exit.$i.out | head -8
    fi
  done
  echo "exit_fail_runs=$fails"
  echo "exit_summary=$(grep -E '^test result' /home/anvil/exit.1.out | head -1)"

  # Step 4: the uring gate.
  cargo fmt --all --check; echo "gate_fmt=$?"
  cargo clippy --locked --all-targets -- -D warnings; echo "gate_clippy_uring=$?"
  cargo clippy --locked --all-targets --features force-mio -- -D warnings; echo "gate_clippy_mio=$?"
  cargo clippy --locked --all-targets --features tls-buffered -- -D warnings; echo "gate_clippy_tls=$?"
  RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ringline; echo "gate_doc=$?"
  cargo test --locked --all; echo "gate_test_uring=$?"
} 2>&1 | tee /home/anvil/verify.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
fail=0
grep -q "^gate_backend=0" verify.log || { echo "FAIL gate_backend"; fail=1; }
grep -q "^red_rc=[1-9]" verify.log || { echo "FAIL red: the test passed on the crossbeam channel"; fail=1; }
red=$(grep -oE "^red_summary=.*" verify.log); echo "$red"
echo "$red" | grep -qE "; 1 failed;" || { echo "FAIL red: expected 1 failed"; fail=1; }
grep -q "^green_rc=0" verify.log || { echo "FAIL green"; fail=1; }
green=$(grep -oE "^green_summary=.*" verify.log); echo "$green"
echo "$green" | grep -qE "1 passed; 0 failed;" || { echo "FAIL green: expected 1 passed"; fail=1; }
grep -q "^exit_fail_runs=0" verify.log || { echo "FAIL exit runs: $(grep -oE '^exit_fail_runs=[0-9]+' verify.log)"; fail=1; }
grep -oE "^exit_summary=.*" verify.log
for gate in gate_fmt gate_clippy_uring gate_clippy_mio gate_clippy_tls gate_doc gate_test_uring; do
  if ! grep -q "^${gate}=0" verify.log; then
    got=$(grep -oE "^${gate}=[0-9]+" verify.log | head -1)
    echo "FAIL ${gate}: ${got:-never reached}"
    fail=1
  else
    echo "ok   ${gate}"
  fi
done
exit $fail
'''
