# Experiment B, uncontended, one arm and one repetition per experiment
# (docs/send-admission-design.md, section 4), each in its own pair of guests.
# send-admission-b-echo.toml compares the arms within one pair of guests.
#
# Server guest on hv02 (z1, 24 vCPU) with ONE worker, pinned by ringline to
# CPU 0. Client guest on hv01 (z2, 56 vCPU), {client_threads} threads. The
# X710 LAG between them, {msg_size} B messages.
#
# arm is one of bench-server's --echo-mode values:
#   bytes-nowait            with_bytes, then send_nowait
#   bytes-admitted          with_bytes, then send_admitted, completion dropped
#   bytes-admitted-timeout  with_bytes, then section 2's example: send_admitted
#                           under timeout(admit_limit), then the completion
#                           under timeout(settle_limit)
#
# Two cells, each between its own barriers:
#   closed  {clients} connections, one request in flight each: saturates the
#           worker. Primary statistic: the worker thread's CPU time per
#           operation, from /proc/<pid>/task/<tid>/schedstat over the measured
#           window, divided by the client's operations in that window.
#   open    {open_rate} requests/s offered, below saturation (skipped when 0).
#           Statistic: the client's p99, measured from each request's
#           scheduled send time.
# The server-side sampler step of each cell has its own rezolus recording.
name = "send-admission B echo {arm} rep{rep}"

[params]
bins_artifact  = "REPLACE-WITH-ARTIFACT-ID"
arm            = "bytes-nowait"
rep            = "1"
image          = "debian-13-6.12"
server_ip      = "172.31.0.1"
client_ip      = "172.31.0.2"
client_threads = "16"
clients        = "256"
msg_size       = "256"
warmup         = "5"
duration       = "20"
open_rate      = "0"

# -- server: hv02 --------------------------------------------------------------

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/* || exit 1
mkdir -p logs
cat /etc/anvil-image.json 2>/dev/null || cat /etc/anvil-instance.json; echo
uname -r; nproc
cat /sys/devices/system/clocksource/clocksource0/current_clocksource
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.core.rmem_max=134217728 net.core.wmem_max=134217728
ip -4 -brief addr show
( cd out && sha256sum * )
got=$(./out/bench-server --print-backend)
[ "$got" = io_uring ] || { echo "BACKEND MISMATCH: bench-server is $got"; exit 1; }
echo "arm={arm} rep={rep} backend=$got"
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "srv"
payload = "exec /home/anvil/out/bench-server --runtime ringline --echo-mode {arm} --addr {server_ip}:7900 --workers 1 --msg-size {msg_size} > /home/anvil/logs/srv.log 2>&1"

[[jobs.steps]]
type = "barrier"
name = "ready-closed"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
payload = '''
set -uo pipefail
pid=$(pgrep -f "out/bench-server --runtime ringline" | head -1)
tid=$(ps -L -o tid=,comm= -p "$pid" | awk '$2=="rl-work-0" {print $1}')
[ -n "$tid" ] || { echo "no rl-work-0 thread in pid $pid"; ps -L -o tid,comm,psr -p "$pid"; exit 1; }
echo "cell=closed arm={arm} rep={rep} pid=$pid worker_tid=$tid"
ps -L -o tid,comm,psr -p "$pid"
grep Cpus_allowed_list /proc/$pid/task/$tid/status
sleep $(({warmup} + 1))
a=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t0=$(date +%s%N)
sleep $(({duration} - 2))
b=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t1=$(date +%s%N)
echo "WORKER cell=closed arm={arm} rep={rep} cpu_ns=$((b - a)) wall_ns=$((t1 - t0))"
'''

[[jobs.steps]]
type = "barrier"
name = "done-closed"
timeout = 1800

[[jobs.steps]]
type = "barrier"
name = "ready-open"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
payload = '''
set -uo pipefail
[ {open_rate} -gt 0 ] || { echo "cell=open skipped"; exit 0; }
pid=$(pgrep -f "out/bench-server --runtime ringline" | head -1)
tid=$(ps -L -o tid=,comm= -p "$pid" | awk '$2=="rl-work-0" {print $1}')
echo "cell=open arm={arm} rep={rep} rate={open_rate} pid=$pid worker_tid=$tid"
sleep $(({warmup} + 1))
a=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t0=$(date +%s%N)
sleep $(({duration} - 2))
b=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t1=$(date +%s%N)
echo "WORKER cell=open arm={arm} rep={rep} cpu_ns=$((b - a)) wall_ns=$((t1 - t0))"
'''

[[jobs.steps]]
type = "barrier"
name = "done-open"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/logs/srv.log"]
payload = '''
sudo systemctl kill -s INT srv
for i in $(seq 1 50); do systemctl is-active --quiet srv || break; sleep 0.2; done
cat /home/anvil/logs/srv.log
grep -q "bytes_send_failed=0 admit_timeouts=0 settle_timeouts=0" /home/anvil/logs/srv.log || echo "WARN: the server refused or closed something"
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"

# -- client: hv01 --------------------------------------------------------------

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/* || exit 1
mkdir -p results
cat /etc/anvil-image.json 2>/dev/null || cat /etc/anvil-instance.json; echo
uname -r; nproc
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 net.ipv4.ip_local_port_range="1024 65535"
ip -4 -brief addr show
ping -c 2 -W 2 {server_ip} || echo "WARN: server address not reachable yet"
'''

[[jobs.steps]]
type = "barrier"
name = "ready-closed"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload = '''
cd /home/anvil
ulimit -n 500000
for i in $(seq 1 100); do (exec 3<>/dev/tcp/{server_ip}/7900) 2>/dev/null && { exec 3>&-; break; }; sleep 0.1; done
./out/bench-client --runtime ringline --addr {server_ip}:7900 --clients {clients} --msg-size {msg_size} --threads {client_threads} --warmup {warmup} --duration {duration} > results/closed.json 2> results/closed.log
echo "CELL closed arm={arm} rep={rep} rc=$? $(tail -1 results/closed.log)"
cat results/closed.json; echo
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "done-closed"
timeout = 1800

[[jobs.steps]]
type = "barrier"
name = "ready-open"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload = '''
cd /home/anvil
[ {open_rate} -gt 0 ] || { echo "cell=open skipped"; exit 0; }
ulimit -n 500000
./out/bench-client --runtime ringline --addr {server_ip}:7900 --clients {clients} --msg-size {msg_size} --threads {client_threads} --warmup {warmup} --duration {duration} --open --rate {open_rate} > results/open.json 2> results/open.log
echo "CELL open arm={arm} rep={rep} rate={open_rate} rc=$? $(tail -1 results/open.log)"
cat results/open.json; echo
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "done-open"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/results.tgz"]
payload = '''
cd /home/anvil && tar czf results.tgz results
ls results
[ -s results/closed.json ]
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
