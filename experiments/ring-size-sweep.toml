# Is the coalescing lever buffers-per-connection, not worker count?
#
# The worker-count sweep (docs/listeners-and-accept-design.md) found CQE/op
# rising 0.47 -> 0.91 -> 1.88 -> 1.86 as workers went 2 -> 4 -> 8 -> 16, and
# read it as per-worker service rate: a busier worker returns to each connection
# less often, so more requests accumulate between visits.
#
# That sweep is confounded. `recv_ring_size` is PER WORKER and was fixed at 256
# in every arm, so changing the worker count changed provided buffers per
# connection by exactly the factor it changed connections per worker:
#
#   w2  128 conns/wkr   2.0 buffers/conn   CQE/op 0.47
#   w4   64 conns/wkr   4.0 buffers/conn   CQE/op 0.91
#   w8   32 conns/wkr   8.0 buffers/conn   CQE/op 1.88
#   w16  16 conns/wkr  16.0 buffers/conn   CQE/op 1.86
#
# min(buffers_per_conn / 4, 1.88) gives 0.50, 1.00, 1.88, 1.88. Four points
# against a post-hoc formula, so that is motivation, not a result.
#
# The mechanism would be the buffer ring rather than the clock: a recv CQE checks
# out a provided buffer and the APPLICATION returns it, so a low
# buffers-per-connection ratio dries the ring, ENOBUFS parks the multishot recv,
# bytes accumulate in the socket buffer, and the recv after replenishment carries
# several requests. Same observable coalescing, cause unrelated to busyness.
#
# THIS IS THE CONTROL. Workers are fixed at 8 for every arm, so per-worker
# service rate does not move at all; only `--recv-ring-size` moves, taking
# buffers-per-connection 8 -> 4 -> 2 -> 1 at a constant 32 connections per
# worker. The mechanism predicts no effect from the thing held constant and a
# full effect from the thing varied -- a control worth more than a repeat.
#
# PREDICTION, written before the run:
#
#   b256 (8/conn)  CQE/op ~1.88   -- replicates the w8 arm; if it does not, stop
#   b128 (4/conn)  CQE/op ~0.9
#   b64  (2/conn)  CQE/op ~0.5
#   b32  (1/conn)  CQE/op <0.5, and this arm may show ENOBUFS pressure or a
#                  throughput shortfall rather than clean coalescing
#
# GO: CQE/op tracks the ring down while all four arms still serve ~600k ops/s.
# Buffers-per-connection is then the mechanism, batching is separable from
# placement, and it can be bought at FULL SPREAD by sizing the ring -- which is
# the answer the accept-placement section is looking for.
#
# NO-GO: CQE/op stays near 1.88 while the ring shrinks 8x. Buffers-per-connection
# is refuted, per-worker load survives as the explanation, and concentration
# really is required to get the batching.
#
# CONFOUND TO WATCH: shrinking the ring also shrinks total pinned recv memory
# (ring_size x 4096 B), so a b32 arm has 128 KiB per worker against b256's 1 MiB.
# If throughput falls, the arm is memory-starved rather than coalescing, and its
# CQE/op is not comparable. That is why ops/s is a GO condition and not just a
# reported number.
#
# Nothing is built on this until the numbers land.
name = "ringsize b{ring_size} rep{rep}"

[matrix]
context_name = "ringline: is the coalescing lever buffers-per-connection? (#443)"
ring_size = ["256", "128", "64", "32"]
rep = ["1"]

[params]
# Update to the artifact id of a fresh `ringline cqe-by-tag build`.
bins_artifact = "01a0e921-ca58-731a-e957-3bf6e46b3e78"
image         = "debian-13-6.12"
server_ip     = "172.31.0.1"
client_ip     = "172.31.0.2"
port          = "7878"
# Identical to the coalesce sweep so the n=1 arm replicates its 8-worker point.
workers       = "8"
clients       = "256"
rate          = "600000"
msg_size      = "64"
warmup        = "5"
duration      = "90"

# ── server: hv02 ───────────────────────────────────────────────────────────

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535
nproc
uname -r
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "ringline-server"
payload = '''
exec /home/anvil/out/bench-server --runtime ringline --addr {server_ip}:{port} \
  --workers {workers} --msg-size {msg_size} --accept-mode merged \
  --echo-mode forward --recv-ring-size {ring_size} \
  --metrics-out /home/anvil/metrics.json
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/cpu.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil
mkdir -p cpu
echo "ring_size={ring_size} workers={workers} rep={rep}" > cpu/arm.txt

# One window over the steady state: there is no readmit here, so the before/
# after pair the park runs needed collapses to a single span.
sleep 12
grep '^cpu[0-9]' /proc/stat > cpu/stat-open
sleep 70
grep '^cpu[0-9]' /proc/stat > cpu/stat-close

# Sample every cpu and score it without assuming a worker->cpu mapping. The
# guest enumerates SMT siblings adjacently, so ringline's SMT-aware pinning
# puts worker W on cpu 2W; a cpu0..cpu7 window would miss half the workers.
# That mistake cost a whole round of park runs.
awk '
  FNR==NR { for (i=2;i<=NF;i++) b[$1,i]=$i; next }
  {
    tot=0; for (i=2;i<=NF;i++) tot += $i - b[$1,i]
    idle=($5-b[$1,5])+($6-b[$1,6])
    pct = (tot>0 ? 100.0*(tot-idle)/tot : 0)
    printf "%s %.1f\n", $1, pct
    sum += pct; if (pct > 50) loaded++
  }
  END { printf "SUMMARY loaded_cores=%d total_busy_pct=%.1f\n", loaded+0, sum+0 }
' cpu/stat-open cpu/stat-close | tee cpu/per-core.txt

cp /home/anvil/metrics.json cpu/ 2>/dev/null || echo "no metrics.json yet" >> cpu/per-core.txt
tar czf /home/anvil/cpu.tgz -C /home/anvil cpu
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/metrics.json"]
payload = '''
# SIGTERM so the server runs its shutdown path and dumps counters.
sudo systemctl stop ringline-server 2>/dev/null || true
sleep 2
echo "--- counters ---"
python3 - <<'EOF'
import json,sys
m = dict()
for e in json.load(open("/home/anvil/metrics.json")):
    m[(e["name"], e.get("op"))] = e["value"]
def g(n, o):
    return m.get(("ringline/" + n, o))
acc = g("connections", "accepted")
for k in ("accepted", "adopted", "park_started", "park_completed"):
    print("%-16s= %s" % (k, g("connections", k)))
print("%-16s= %s" % ("bytes_received", g("bytes", "received")))
# The run has to prove it carried load before any ratio computed from it means
# anything. accepted==1 is the /dev/tcp reachability probe alone -- the
# signature of a client that never started, which made six park runs unreadable.
want = {clients}
if acc is None or acc < want:
    print("FATAL: accepted=%s < clients=%s: no workload, counters uninterpretable" % (acc, want))
    sys.exit(1)
print("workload OK: accepted=%s >= clients=%s" % (acc, want))
EOF
rc=$?
exit $rc
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

# ── client: hv01 ───────────────────────────────────────────────────────────

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo prlimit --nofile=1000000 --pid $$ 2>/dev/null || true
echo "fd soft=$(ulimit -Sn) hard=$(ulimit -Hn) clients={clients}"
ip -4 -brief addr show
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/client.log"]
payload = '''
set -uo pipefail
cd /home/anvil
for i in $(seq 1 120); do
  (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; echo "server reachable after ${i}s"; break; }
  sleep 1
done
# Open loop at a fixed offered rate: the question is the cost per operation at
# constant throughput, so the load must not adapt to the server's latency the
# way a closed loop would.
./out/bench-client --runtime ringline --addr {server_ip}:{port} --clients {clients} \
  --threads 8 --msg-size {msg_size} --warmup {warmup} --duration {duration} \
  --open --rate {rate} \
  2>&1 | tee /home/anvil/client.log
rc=${PIPESTATUS[0]}
echo "client_rc=${rc}" | tee -a /home/anvil/client.log
# A run with no load must not be reportable as a result.
exit "$rc"
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
