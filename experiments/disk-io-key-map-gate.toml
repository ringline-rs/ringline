# Gate run for the file I/O audit's P2 (#876): the executor keeps one
# `DiskIoEntry` per disk-I/O key in one map with a multiplicative hasher, and
# `fs::stat` on io_uring writes into a statx buffer inline in the command slab
# entry instead of a Box per call. The io_uring side (`handle_fs`,
# `DriverCtx::fs_stat`, the two event-loop unit tests that reach the entry
# map) does not compile on macOS; this run builds and gates it in an
# ephemeral VM on the `validation` agent, never by a login to a rig host.
#
# Prediction: unit_rc 0 with each named test reported ok; every gate 0. A
# statx buffer that moved before its CQE would show as wrong metadata in the
# fs stat integration tests, which `cargo test --all` runs.
#
#   systemslab submit experiments/disk-io-key-map-gate.toml
name = "ringline disk-io-key-map gate ({branch})"

[params]
branch = "perf-disk-io-key-map"
repo   = "https://github.com/brayniac/ringline"

[[jobs]]
name = "verify"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "debian-13-6.12"
slots = 1
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 7200
artifacts = ["/home/anvil/verify.log"]
upload = true
payload = '''
set -uo pipefail
cat /etc/anvil-instance.json 2>/dev/null; echo
rustc -V 2>/dev/null; uname -r
cd /home/anvil
{
  uname -srm
  echo "io_uring_disabled=$(sysctl -n kernel.io_uring_disabled 2>/dev/null || echo unset)"
  cargo --version

  git clone -q {repo} src && git -C src checkout -q {branch}
  cd src && git log --oneline -3

  ulimit -Sn 65536
  echo "nofile_soft=$(ulimit -Sn)"

  # This must be the io_uring build; a mio build would run none of the code
  # under test and report green for it.
  cargo build --locked -q -p ringline-bench --bin bench-server
  got=$(./target/debug/bench-server --print-backend)
  [ "$got" = "io_uring" ] || { echo "BACKEND MISMATCH: $got"; echo "gate_backend=1"; exit 1; }
  echo "gate_backend=0 (backend=$got)"

  # The lib tests that reach the entry map and the slab, each named below.
  cargo test --locked -p ringline --lib -- disk_io abandoned fs::tests > /home/anvil/unit.out 2>&1; echo "unit_rc=$?"
  grep -E '^test result| \.\.\. (ok|FAILED)$' /home/anvil/unit.out
  cargo fmt --all --check; echo "gate_fmt=$?"
  cargo clippy --locked --all-targets -- -D warnings; echo "gate_clippy_uring=$?"
  cargo clippy --locked --all-targets --features force-mio -- -D warnings; echo "gate_clippy_mio=$?"
  cargo clippy --locked --all-targets --features tls-buffered -- -D warnings; echo "gate_clippy_tls=$?"
  RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ringline; echo "gate_doc=$?"
  cargo test --locked --all; echo "gate_test_uring=$?"
} 2>&1 | tee /home/anvil/verify.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
fail=0
grep -q "^gate_backend=0" verify.log || { echo "FAIL gate_backend"; fail=1; }
grep -q "^unit_rc=0" verify.log || { echo "FAIL unit tests"; fail=1; }
for t in a_disk_io_result_delivered_before_the_poll_is_taken_once \
         a_disk_io_completion_wakes_the_task_that_polled_last \
         a_parked_disk_io_buffer_is_freed_by_its_completion \
         an_abandoned_disk_io_open_is_taken_once_and_its_result_discarded \
         an_abandoned_disk_io_key_discards_a_later_result \
         disk_io_future_drop_clears_waiter \
         a_key_abandoned_outside_the_executor_is_released; do
  grep -qE "${t} \.\.\. ok$" verify.log || { echo "FAIL ${t} did not report ok"; fail=1; }
done
for gate in gate_fmt gate_clippy_uring gate_clippy_mio gate_clippy_tls gate_doc gate_test_uring; do
  if ! grep -q "^${gate}=0" verify.log; then
    got=$(grep -oE "^${gate}=[0-9]+" verify.log | head -1)
    echo "FAIL ${gate}: ${got:-never reached}"
    fail=1
  else
    echo "ok   ${gate}"
  fi
done
exit $fail
'''
