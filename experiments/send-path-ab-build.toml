# Build the bench binaries once (delta, validation host), upload them as one
# artifact, and let every measurement arm take them as an input. Four server
# binaries (before/after x io_uring/mio) and one client binary (before, io_uring:
# the load generator is held constant so only the server under test varies).
# No target-cpu=native: delta is Zen4, the hypervisors are Zen2/Zen1.
name = "ringline send-path A/B build (before={before_ref} after={after_ref})"

[params]
before_ref  = "c419d05"
before_repo = "https://github.com/ringline-rs/ringline"
after_ref   = "main"
after_repo  = "https://github.com/ringline-rs/ringline"

[[jobs]]
name = "build"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "debian-13-6.12"
slots = 1
memory_gib = 4
ports = 0
gpu = false
payload_timeout = 3600
artifacts = ["/home/anvil/bench-bins.tgz", "/home/anvil/build.log"]
upload = true
payload = '''
set -uo pipefail
# The image family moves; record which image, rustc and kernel ran.
cat /etc/anvil-instance.json 2>/dev/null; echo
rustc -V 2>/dev/null; uname -r
cd /home/anvil
{
  cat /etc/anvil-instance.json
  mkdir -p out
  git clone -q {before_repo} before-src && git -C before-src checkout -q {before_ref}
  git clone -q {after_repo} after-src && git -C after-src checkout -q {after_ref}
  for src in before-src after-src; do
    label=${src%-src}
    ( cd $src
      echo "== $label: $(git log --oneline -1)"
      cargo build --release -p ringline-bench --bin bench-server --bin bench-client
      cp target/release/bench-server ../out/bench-server-$label-uring
      cp target/release/bench-client ../out/bench-client-$label-uring
      # `--features force-mio`, not `--features ringline/force-mio`: the
      # latter flips ringline's backend without flipping ringline-bench's own
      # `has_io_uring` cfg (its build.rs keys off the bench crate's feature,
      # added in #402), so the bench compiles io_uring-only calls against a
      # mio runtime and fails — leaving the previous binary in place.
      cargo build --release -p ringline-bench --features force-mio --bin bench-server
      cp target/release/bench-server ../out/bench-server-$label-mio
    ) || exit 1
  done
  ( cd out && sha256sum * )
  # Prove each binary is the backend its name claims. A failed build leaves
  # the previous binary in place, and two arms that are secretly the same
  # binary report a dead heat — which looks like a result.
  for label in before after; do
    for want in uring mio; do
      got=$(./out/bench-server-$label-$want --print-backend)
      case "$want:$got" in
        uring:io_uring|mio:mio) echo "backend ok: $label-$want -> $got" ;;
        *) echo "BACKEND MISMATCH: $label-$want built as $got"; exit 1 ;;
      esac
    done
  done
  tar czf bench-bins.tgz out
} 2>&1 | tee /home/anvil/build.log
rc=${PIPESTATUS[0]}
echo "build_status=$rc" | tee -a /home/anvil/build.log
exit 0
'''
