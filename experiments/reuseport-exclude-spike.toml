name = "ringline reuseport exclusion primitive"

[[jobs]]
name = "spike"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "debian-13-6.12"
slots = 1
memory_gib = 4
ports = 0
gpu = false
payload_timeout = 600
artifacts = ["/home/anvil/exclude.log"]
upload = true
payload = '''
set -uo pipefail
# The image family moves; record which image, rustc and kernel ran.
cat /etc/anvil-instance.json 2>/dev/null; echo
rustc -V 2>/dev/null; uname -r
cd /home/anvil
{
  uname -srm
  echo "" | base64 -d > exclude_spike.c
  gcc -O2 -Wall -Wextra -o exclude_spike exclude_spike.c || exit 1
  echo "== index by CPU (excluding 3) =="
  ./exclude_spike 24710 3 0 || exit 1
  echo
  echo "== index by RANDOM (excluding 3) =="
  ./exclude_spike 24711 3 1 || exit 1
  echo
  echo "== index by RANDOM (excluding 0) =="
  ./exclude_spike 24712 0 1 || exit 1
} 2>&1 | tee /home/anvil/exclude.log
rc=${PIPESTATUS[0]}
echo "spike_status=$rc" | tee -a /home/anvil/exclude.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
grep -q "spike_status=0" exclude.log || { echo failed; exit 1; }
echo ok
'''
