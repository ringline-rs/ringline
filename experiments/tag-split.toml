# Which completions coalesce: recv, send, or both?
#
# Scaffolding (image, shapes, barriers, workload, assertions) is shared with the
# other specs in this directory so results stay comparable across them.
#
# THE GAP THIS CLOSES. Every mechanism claim in this campaign has bottomed out on
# the same limit: `ring/cqe_processed` is a single total. A 64-byte echo costs
# ~0.84 completions per operation at 4 workers and ~1.78 at 8, against a ceiling
# of 2.0 = one recv + one send. Those numbers are equally consistent with
#
#   (a) recv batching   -- one recv CQE carrying several pipelined requests,
#   (b) send coalescing -- one sendmsg CQE covering several queued responses,
#   (c) both halves moving together, which is what 0.84 ~ 0.42+0.42 suggests,
#
# and NO artifact collected so far can tell them apart. They are different levers
# with different fixes, so the distinction is the whole question.
#
# `ringline/cqe_by_tag` (this branch) splits the total by OpTag, so the recv tags
# (recv_multi, recv_fallback) and the send tags (send, send_msg_coalesced,
# send_recv_buf, send_recv_bufs_coalesced, send_poll_out, ...) are counted
# separately. The arithmetic is then direct rather than inferred.
#
# PREDICTION, written before the run. Per operation, at w8 vs w4:
#
#   if (a): recv/op falls from ~1.0 toward ~0.4 while send/op stays near 1.0
#   if (b): send/op falls while recv/op stays near 1.0
#   if (c): both fall by roughly the same factor
#
# The w8 arm should land near recv/op 0.9 + send/op 0.9 = 1.78, and the w4 arm
# near 0.42 + 0.42 = 0.84, if (c) holds. Any split that does not sum to the
# CQE/op already measured for that worker count means the tags do not partition
# the total and something is being double counted or missed -- check that
# cqe_by_tag plus cqe_unknown_tag equals cqe_processed before reading anything
# else.
#
# TWO REPS EACH, because the CQE/op noise floor at w8 is 6.4% CV and a
# recv-vs-send split of a 2x effect needs to survive that. Two is not a floor
# estimate; it is enough to catch a wild arm.
#
# NOTE: only w4 and w8, not the whole matrix. That pair is where the 0.84-vs-1.78
# gap lives, and 4 runs answers the question where 12 would re-measure things the
# existing artifacts already establish.
#
name = "tag w{workers} rep{rep}"

[matrix]
context_name = "ringline: which completions coalesce, recv or send? (#443)"
workers = ["4", "8"]
rep = ["1", "2"]

[params]
# Update to the artifact id of a fresh `ringline cqe-by-tag build`.
bins_artifact = "01a0ea53-0361-7393-2d9a-47a6e26eee1b"
image         = "spool/images/debian-13-6.12-20260912.1@golden"
server_ip     = "172.31.0.1"
client_ip     = "172.31.0.2"
port          = "7878"
# workers is a matrix variable here -- see [matrix].
clients       = "256"
rate          = "600000"
msg_size      = "64"
warmup        = "5"
duration      = "90"

# ── server: hv02 ───────────────────────────────────────────────────────────

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535
nproc
uname -r
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "ringline-server"
payload = '''
exec /home/anvil/out/bench-server --runtime ringline --addr {server_ip}:{port} \
  --workers {workers} --msg-size {msg_size} --accept-mode merged \
  --echo-mode forward \
  --metrics-out /home/anvil/metrics.json
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/cpu.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil
mkdir -p cpu
echo "workers={workers} rep={rep} tagsplit=1" > cpu/arm.txt

# One window over the steady state: there is no readmit here, so the before/
# after pair the park runs needed collapses to a single span.
sleep 12
grep '^cpu[0-9]' /proc/stat > cpu/stat-open
sleep 70
grep '^cpu[0-9]' /proc/stat > cpu/stat-close

# Sample every cpu and score it without assuming a worker->cpu mapping. The
# guest enumerates SMT siblings adjacently, so ringline's SMT-aware pinning
# puts worker W on cpu 2W; a cpu0..cpu7 window would miss half the workers.
# That mistake cost a whole round of park runs.
awk '
  FNR==NR { for (i=2;i<=NF;i++) b[$1,i]=$i; next }
  {
    tot=0; for (i=2;i<=NF;i++) tot += $i - b[$1,i]
    idle=($5-b[$1,5])+($6-b[$1,6])
    pct = (tot>0 ? 100.0*(tot-idle)/tot : 0)
    printf "%s %.1f\n", $1, pct
    sum += pct; if (pct > 50) loaded++
  }
  END { printf "SUMMARY loaded_cores=%d total_busy_pct=%.1f\n", loaded+0, sum+0 }
' cpu/stat-open cpu/stat-close | tee cpu/per-core.txt

cp /home/anvil/metrics.json cpu/ 2>/dev/null || echo "no metrics.json yet" >> cpu/per-core.txt
tar czf /home/anvil/cpu.tgz -C /home/anvil cpu
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/metrics.json"]
payload = '''
# SIGTERM so the server runs its shutdown path and dumps counters.
sudo systemctl stop ringline-server 2>/dev/null || true
sleep 2
echo "--- counters ---"
python3 - <<'EOF'
import json,sys
m = dict()
for e in json.load(open("/home/anvil/metrics.json")):
    m[(e["name"], e.get("op"))] = e["value"]
def g(n, o):
    return m.get(("ringline/" + n, o))
acc = g("connections", "accepted")
for k in ("accepted", "adopted", "park_started", "park_completed"):
    print("%-16s= %s" % (k, g("connections", k)))
print("%-16s= %s" % ("bytes_received", g("bytes", "received")))
# The run has to prove it carried load before any ratio computed from it means
# anything. accepted==1 is the /dev/tcp reachability probe alone -- the
# signature of a client that never started, which made six park runs unreadable.
want = {clients}
if acc is None or acc < want:
    print("FATAL: accepted=%s < clients=%s: no workload, counters uninterpretable" % (acc, want))
    sys.exit(1)
print("workload OK: accepted=%s >= clients=%s" % (acc, want))
EOF
rc=$?
exit $rc
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

# ── client: hv01 ───────────────────────────────────────────────────────────

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo prlimit --nofile=1000000 --pid $$ 2>/dev/null || true
echo "fd soft=$(ulimit -Sn) hard=$(ulimit -Hn) clients={clients}"
ip -4 -brief addr show
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/client.log"]
payload = '''
set -uo pipefail
cd /home/anvil
for i in $(seq 1 120); do
  (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; echo "server reachable after ${i}s"; break; }
  sleep 1
done
# Open loop at a fixed offered rate: the question is the cost per operation at
# constant throughput, so the load must not adapt to the server's latency the
# way a closed loop would.
./out/bench-client --runtime ringline --addr {server_ip}:{port} --clients {clients} \
  --threads 8 --msg-size {msg_size} --warmup {warmup} --duration {duration} \
  --open --rate {rate} \
  2>&1 | tee /home/anvil/client.log
rc=${PIPESTATUS[0]}
echo "client_rc=${rc}" | tee -a /home/anvil/client.log
# A run with no load must not be reportable as a result.
exit "$rc"
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
