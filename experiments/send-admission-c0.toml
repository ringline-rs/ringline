# Experiment C, stage C0 (docs/send-admission-design.md, section 4): the
# runtime under order O0, O1 or O7w, in workload W1 or W2, over plaintext or
# TLS, measured with the instruments of Experiment C.
#
# One cell and one repetition per experiment, in one guest on hv03:
# admission-server (one worker, pinned to CPU 0) and admission-load (CPUs 2
# and up) over loopback. net.ipv4.tcp_wmem is capped at {tcp_wmem_max} B,
# which bounds each socket's send buffer, so a reply to a peer that reads
# slowly or not at all stays in the send pool. The defaults are W1 at a ratio
# of admit_ms to settle_ms of 1. W2 sets stall_peers to 0, and sets the
# drainers, the slow readers, pipeline and tcp_wmem_max.
#
# Parameters:
#   bins_artifact   bench-bins.tgz from send-admission-c-build.toml
#   workload        a label carried into the RUN line; it changes nothing
#   small_send      admitted (replies of at most 4096 B wait in the FIFO
#                   with send_admitted, under order) or send (O1: they are
#                   sent with send)
#   order           the runtime's admission order for send_admitted: strict
#                   (O0 with small_send=admitted) or budget (O7w)
#   budget          for order=budget, the most slots sends admitted past a
#                   waiting head may hold at once
#   tls             1 runs both ends over TLS: the server generates a
#                   self-signed certificate and writes it to
#                   results/cert.pem, which the load trusts. It needs
#                   slot_size of at least 16413 (one whole TLS record); the
#                   server refuses a smaller one and the job fails. 0 is
#                   plaintext.
#   admit_ms        the server's bound on a wait for admission, and the
#                   latency the load counts as delivered within the limit
#   settle_ms       the server's bound on a reply's time unsettled
#   pipeline        replies a connection may have admitted and unsettled
#                   before the server stops reading its requests
#   rep             the repetition, carried into the RUN line
#   image           the guest image
#   warmup          seconds of load before the measurement window
#   duration        seconds in the measurement window
#   episode_ms      the period of the episodes, which start with the window:
#                   drainers and stalled peers at the start, the head
#                   large_delay_ms later
#   small_conns     fast small connections, which read every reply at once
#   small_rate      their requests per second, over all of them, open loop
#   small_size      their reply bytes
#   stall_peers     peers per episode that ask for one reply and never read
#   stall_size      each stalled peer's reply bytes
#   large_size      the head's reply bytes; it waits at the head of the FIFO
#   large_delay_ms  the head's delay after the episode start
#   slow_conns      slow small connections
#   slow_rate       requests per second on each, open loop
#   slow_size       their reply bytes
#   slow_read_bps   the most each reads per second
#   slow_rcvbuf     SO_RCVBUF on each, set before the connect; 0 leaves it
#                   to the kernel, which autotunes it within tcp_rmem
#   drainers        connections per episode that ask for one reply and read
#                   it at drain_read_bps
#   drain_size      each drainer's reply bytes
#   drain_read_bps  the most each drainer reads per second
#   drain_rcvbuf    SO_RCVBUF on each drainer, set before the connect; 0
#                   leaves it to the kernel
#   outside_conns   connections whose replies the server sends with
#                   send (completion dropped), outside the FIFO
#   outside_rate    their requests per second, over all of them
#   outside_size    their reply bytes
#   tcp_wmem_max    the cap on net.ipv4.tcp_wmem, in bytes
#   pool_slots      the server's send-pool slots
#   slot_size       the server's send-pool slot bytes
#
# Measured by admission-server, over requests scheduled in the window: per
# reply class (small to fast readers, small to slow readers, large), the
# delay from each request's scheduled send time to its reply's admission and
# the count beyond admit_ms; each large reply's admission delay or why it was
# not admitted; and the send-pool slots held by each class, sampled every
# 10 ms and averaged over each large reply's wait. Measured by
# admission-load: each class's end-to-end latency, the replies not delivered
# within admit_ms, each episode's head and drainer times, and the outside
# connections' counts.
#
# Under order=budget the server also counts, per class, the replies admitted
# past a waiting head and how long each held its slots, samples B (the slots
# such sends hold) with the held slots, and prints the runtime's admission
# counters.
#
# The job prints a RUN line with every parameter that varies between cells,
# then the LOAD and SERVER JSON lines; results.tgz holds load.json,
# server.json and both logs. send-admission-c0-report.py reads them.
name = "send-admission C0 {workload} {small_send} {order} tls{tls} admit{admit_ms} n{pipeline} rep{rep}"

[params]
bins_artifact  = "REPLACE-WITH-ARTIFACT-ID"
workload       = "W1"
small_send     = "admitted"
order          = "strict"
budget         = "32"
tls            = "0"
admit_ms       = "1000"
settle_ms      = "1000"
pipeline       = "1"
rep            = "1"
image          = "debian-13-6.12"
warmup         = "4"
duration       = "40"
episode_ms     = "4000"
small_conns    = "16"
small_rate     = "2000"
small_size     = "256"
stall_peers    = "3"
stall_size     = "3145728"
large_size     = "7340032"
large_delay_ms = "200"
slow_conns     = "0"
slow_rate      = "0"
slow_size      = "4096"
slow_read_bps  = "0"
slow_rcvbuf    = "4096"
drainers       = "0"
drain_size     = "2097152"
drain_read_bps = "0"
drain_rcvbuf   = "4096"
outside_conns  = "0"
outside_rate   = "0"
outside_size   = "256"
tcp_wmem_max   = "1048576"
pool_slots     = "512"
slot_size      = "16384"

[[jobs]]
name = "vm"
tags = ["host:hv03"]

[[jobs.steps]]
uses = "anvil-vm"
[jobs.steps.with]
shape = "auto.c"
image = "{image}"
memory_gib = 8
gpu = false
boot_timeout = 600
payload_timeout = 900
upload = true
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
artifacts = ["/home/anvil/results.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/* || exit 1
mkdir -p results
cat /etc/anvil-image.json 2>/dev/null || cat /etc/anvil-instance.json; echo
uname -r; nproc
( cd out && sha256sum admission-server admission-load )
ulimit -n 65536
sudo sysctl -w net.ipv4.tcp_wmem="4096 16384 {tcp_wmem_max}"
sysctl net.ipv4.tcp_rmem
last=$(($(nproc) - 1))
case "{tls}" in
  0) srv_tls=""; load_tls="" ;;
  1) srv_tls="--tls --tls-cert-out /home/anvil/results/cert.pem"; load_tls="--tls --tls-ca /home/anvil/results/cert.pem" ;;
  *) echo "tls must be 0 or 1, not {tls}"; exit 1 ;;
esac
./out/admission-server --addr 127.0.0.1:7979 --small-send {small_send} --order {order} --budget {budget} $srv_tls --admit-limit-ms {admit_ms} --settle-limit-ms {settle_ms} --pipeline {pipeline} --pool-slots {pool_slots} --slot-size {slot_size} --cpu 0 > results/server.json 2> results/server.log &
srv=$!
for i in $(seq 1 100); do kill -0 $srv 2>/dev/null || break; (exec 3<>/dev/tcp/127.0.0.1/7979) 2>/dev/null && { exec 3>&-; break; }; sleep 0.1; done
kill -0 $srv 2>/dev/null || { echo "admission-server exited before the load started"; cat results/server.log; tar czf results.tgz results; exit 1; }
taskset -c 2-$last ./out/admission-load --addr 127.0.0.1:7979 --duration {duration} --warmup {warmup} --within-ms {admit_ms} --episode-ms {episode_ms} --small-conns {small_conns} --small-rate {small_rate} --small-size {small_size} --stall-peers {stall_peers} --stall-size {stall_size} --large-size {large_size} --large-delay-ms {large_delay_ms} --slow-conns {slow_conns} --slow-rate {slow_rate} --slow-size {slow_size} --slow-read-bps {slow_read_bps} --slow-rcvbuf {slow_rcvbuf} --drainers {drainers} --drain-size {drain_size} --drain-read-bps {drain_read_bps} --drain-rcvbuf {drain_rcvbuf} --outside-conns {outside_conns} --outside-rate {outside_rate} --outside-size {outside_size} $load_tls > results/load.json 2> results/load.log
rc=$?
kill -INT $srv; wait $srv
echo "RUN workload={workload} small_send={small_send} order={order} budget={budget} tls={tls} admit_ms={admit_ms} settle_ms={settle_ms} pipeline={pipeline} tcp_wmem_max={tcp_wmem_max} small_conns={small_conns} small_rate={small_rate} small_size={small_size} stall_peers={stall_peers} stall_size={stall_size} large_size={large_size} slow_conns={slow_conns} slow_rate={slow_rate} slow_size={slow_size} slow_read_bps={slow_read_bps} slow_rcvbuf={slow_rcvbuf} drainers={drainers} drain_size={drain_size} drain_read_bps={drain_read_bps} drain_rcvbuf={drain_rcvbuf} outside_conns={outside_conns} outside_rate={outside_rate} outside_size={outside_size} pool_slots={pool_slots} slot_size={slot_size} rep={rep} load_rc=$rc"
echo "LOAD $(cat results/load.json)"
echo "SERVER $(cat results/server.json)"
tail -3 results/server.log results/load.log
tar czf results.tgz results
[ $rc -eq 0 ] && [ -s results/load.json ] && [ -s results/server.json ]
'''
