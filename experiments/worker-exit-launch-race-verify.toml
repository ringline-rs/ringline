# Failure-rate run for #783: `a_worker_stopping_during_launch_does_not_hang_it`
# at a main commit and at the fix, each {n} times, in an ephemeral VM on the
# `validation` agent (CLAUDE.md, "Verifying io_uring code"; the test is
# io_uring only).
#
# The worker that stops on its first loop iteration reports startup before
# that iteration, and `launch()` listens once every worker has reported, so a
# connection made as soon as `launch()` returns can hash to the stopping
# worker's socket and be closed by `stop_accepting`. The fix waits for the
# exit before connecting.
#
# Prediction: failures at `main_ref` with `[Closed, Yes, ...]`; none at the
# fix. First run (experiment 01a1c116-42ce-71cb-1577-ae07bb81b301, Debian 13,
# kernel 6.12): 1 of 300 at main, 0 of 300 at the fix.
#
#   systemslab submit experiments/worker-exit-launch-race-verify.toml
name = "ringline worker-exit launch race verify ({branch})"

[params]
repo     = "https://github.com/brayniac/ringline"
branch   = "fix/worker-exit-tests-wait-for-the-exit"
main_ref = "90d81de68c82ab249250c81f9f8651598e8673e8"
test     = "a_worker_stopping_during_launch_does_not_hang_it"
n        = "3000"

[[jobs]]
name = "verify"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "debian-13-6.12"
slots = 1
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 7200
artifacts = ["/home/anvil/verify.log", "/home/anvil/failures.log"]
upload = true
payload = '''
set -uo pipefail
cd /home/anvil
: > /home/anvil/failures.log
{
  uname -srm; nproc; cargo --version
  git clone -q {repo} src && cd src && git checkout -q {branch} && git log --oneline -1
  ulimit -Sn 65536; echo "nofile_soft=$(ulimit -Sn)"

  # This must be the io_uring build; a mio build would run none of the code
  # under test and report green for it.
  cargo build --locked -q -p ringline-bench --bin bench-server
  got=$(./target/debug/bench-server --print-backend)
  [ "$got" = "io_uring" ] || { echo "BACKEND MISMATCH: $got"; echo "gate_backend=1"; exit 1; }
  echo "gate_backend=0 (backend=$got)"

  bin() { cargo test --locked -p ringline --lib --no-run 2>&1 | grep -oE 'target/debug/deps/ringline-[0-9a-f]+' | head -1; }
  loop() {
    local label=$1 B fails=0 i out
    B=$(bin)
    for i in $(seq 1 {n}); do
      out=$(./$B {test} --test-threads=1 2>&1)
      if ! echo "$out" | grep -q 'test result: ok'; then
        fails=$((fails+1)); { echo "=== $label run $i"; echo "$out" | grep -E 'panicked|Closed|Hung|test result'; } >> /home/anvil/failures.log
      fi
    done
    echo "${label} runs={n} fails=$fails"
  }

  git checkout -q {main_ref} && git log --oneline -1
  loop main
  git checkout -q {branch} && git log --oneline -1
  loop fix
  cargo clippy --locked -p ringline --all-targets -- -D warnings; echo "gate_clippy_uring=$?"
} 2>&1 | tee /home/anvil/verify.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
fail=0
grep -E '^(gate_|main |fix )' verify.log
grep -q "^gate_backend=0" verify.log || { echo "FAIL gate_backend"; fail=1; }
grep -q "^fix runs=.* fails=0$" verify.log || { echo "FAIL: the fix still fails"; fail=1; }
grep -q "^gate_clippy_uring=0" verify.log || { echo "FAIL clippy"; fail=1; }
exit $fail
'''
