[package]
name = "ringline"
version = "0.7.0-alpha.25"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Async I/O runtime with io_uring (Linux) and mio (cross-platform) backends"
readme = "README.md"
keywords = ["io-uring", "async", "networking", "event-loop"]
categories = ["asynchronous", "network-programming"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(has_io_uring)", "cfg(uring_engine)"]

[features]
force-mio = []
testing = []
# Selects rustls' buffered API (`ServerConnection`/`ClientConnection`,
# `writer()`/`write_tls()`) for the TLS record layer. Without it the
# unbuffered API (`UnbufferedConnectionCommon`) is used: rustls'
# `dangerous_into_kernel_connection`, the path to kTLS, exists only there.
# Application-data sends cost 2 copies on the buffered engine. On the
# unbuffered engine, with the ring or aws-lc-rs provider, a TLS 1.3 record
# costs 1 and a TLS 1.2 record 2 (see
# ringline/src/tls/unbuffered/mod.rs).
tls-buffered = []
# The unbuffered engine is the default; this feature has no effect and is
# kept so existing `features = ["tls-unbuffered"]` builds still resolve.
tls-unbuffered = []

[dependencies]
futures-io = "0.3"
bytes = { workspace = true }
crossbeam-channel = "0.5"
libc = "0.2"
mio = { version = "1", features = ["os-poll", "net", "os-ext"] }
metriken = "0.11.3"
pin-project-lite = "0.2"
thiserror = "2"
# ringline-rs/rustls, a fork of rustls; see the workspace Cargo.toml.
ringline-tls = { workspace = true, features = ["std", "ring"] }
ringline-tls-config = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
bytes = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
futures-io = "0.3"
futures-util = { version = "0.3", features = ["io"] }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true }
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }

[[bench]]
name = "accumulator"
harness = false
path = "benches/accumulator.rs"

[[bench]]
name = "buffer"
harness = false
path = "benches/buffer.rs"

[[bench]]
name = "connect"
harness = false
path = "benches/connect.rs"

[[bench]]
name = "echo"
harness = false
path = "benches/echo.rs"

[[bench]]
name = "timer"
harness = false
path = "benches/timer.rs"
