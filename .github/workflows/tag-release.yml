name: Tag Release

on:
  push:
    branches: [main]

jobs:
  tag-release:
    uses: brayniac/rust-workflows/.github/workflows/tag-release.yml@v1
    # By name, not `secrets: inherit`: GitHub only carries inherited secrets
    # between repositories in the same organization, and the shared workflow
    # lives under a different owner. With `inherit` the v0.6.3 release passed
    # the gate and failed at checkout with an empty token (run 34414344980).
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      # The root is a virtual manifest; the core crate carries the released
      # version and its tag is `vX.Y.Z`.
      version-manifest: ringline/Cargo.toml
      # Forks run this on their own `main` too; only the upstream repo tags.
      only-repository: ringline-rs/ringline
      # After tagging, open a PR bumping only the core crate, and the
      # workspace's `ringline` requirement, to the next minor's first
      # prerelease (v0.7.0 -> 0.8.0-alpha.0): main carries the next minor, and
      # patch releases come from `release/X.Y.x`. Scoped to `ringline` because
      # the satellite crates (redis, memcache, the unpublished tools) version
      # on their own cadence and an unscoped bump would drag them to the core
      # version.
      dev-bump: pr
      dev-bump-package: ringline
      dev-bump-style: minor-alpha
