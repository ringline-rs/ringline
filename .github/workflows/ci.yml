name: CI

on:
  push:
    # release/** are maintenance branches (e.g. release/0.6.x): patch releases
    # are cut and tagged there by hand, so CI must run on them too.
    branches: [main, 'release/**']
  pull_request:
    # Backports reach release/** through PRs, and need the same gate.
    branches: [main, 'release/**']
  workflow_call:
  schedule:
    # Daily at 13:17 UTC so the RustSec advisory database catches
    # vulnerabilities published against our pinned deps even when nothing
    # in-tree changes.
    - cron: '17 13 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  clippy-mio:
    name: Clippy (mio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --features force-mio -- -D warnings

  clippy-tls-unbuffered:
    name: Clippy (tls-unbuffered)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --features tls-unbuffered -- -D warnings

  clippy-macos:
    name: Clippy (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-features --all-targets

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # `--deny warnings` promotes informational advisories
      # (unmaintained, unsound, notice) to errors. Downstream consumers
      # pulling ringline transitives get caught by their own audits, so
      # we hold the same bar here.
      - run: cargo audit --deny warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --locked --workspace --profile ci
      - run: cargo test --locked --workspace --doc
      # A run on 2026-09-22 aborted the release test binary with a bare ENOMEM
      # from `register_buf_ring`. The error text blames RLIMIT_MEMLOCK, but that
      # was measured and ruled out: on kernel 6.12 the whole uring test suite
      # passes with the soft limit at 8 KiB, so the ring is not charged there.
      # What is left is genuine kernel memory pressure, which nothing recorded.
      # Capture it on failure so the next occurrence is diagnosable instead of
      # being re-argued from the same empty log.
      - name: Resource state (on failure)
        if: failure()
        run: |
          # GitHub runs this with `bash -e`, and a diagnostic that aborts partway
          # is worse than none: an unguarded non-zero status (a `for` whose last
          # `[ -r ]` test fails, say) truncates the step right before whatever it
          # was added to capture. This step only runs when the job has already
          # failed, so nothing here should ever be fatal.
          set +e
          echo "=== limits ==="; ulimit -a || true
          # `free` reads host-wide /proc/meminfo, so it cannot see a cgroup
          # limit. A run on 2026-09-29 aborted with io_uring_setup ENOMEM while
          # this reported 11.5 GiB free and 14.9 GiB available -- which rules
          # host memory out and leaves the accounting that `free` is blind to.
          echo "=== memory (HOST -- see cgroup below) ==="; free -m || true
          # io_uring charges ring memory to the memcg on modern kernels, so a
          # cgroup limit yields exactly this signature: ENOMEM at setup with the
          # host showing gigabytes free. `memory.events` and `memory.peak` are
          # retrospective -- they survive the death of the process that failed,
          # which `memory.current` alone does not.
          echo "=== cgroup memory (v2) ==="
          for f in memory.max memory.high memory.current memory.peak memory.events memory.swap.max; do
            [ -r "/sys/fs/cgroup/$f" ] && echo "--- $f ---" && cat "/sys/fs/cgroup/$f"
          done || true
          echo "=== cgroup memory of this process's own cgroup ==="
          cg=$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup 2>/dev/null)
          if [ -n "$cg" ] && [ -d "/sys/fs/cgroup$cg" ]; then
            for f in memory.max memory.current memory.peak memory.events; do
              [ -r "/sys/fs/cgroup$cg/$f" ] && echo "--- $cg/$f ---" && cat "/sys/fs/cgroup$cg/$f"
            done
          else
            echo "no cgroup v2 path for self; trying v1"
            for f in limit_in_bytes usage_in_bytes max_usage_in_bytes failcnt; do
              [ -r "/sys/fs/cgroup/memory/memory.$f" ] && echo "--- v1 memory.$f ---" && cat "/sys/fs/cgroup/memory/memory.$f"
            done
          fi
          # PSI records memory stall even when nothing was OOM-killed.
          echo "=== memory pressure (PSI) ==="; cat /proc/pressure/memory 2>/dev/null || echo "no PSI"
          # io_uring_setup mmaps its rings, so the map-count ceiling is a
          # candidate ENOMEM source that neither `ulimit -a` nor `free` shows.
          # NOTE: this records the LIMIT only. The failing process is already
          # gone by the time this step runs, so its own map count cannot be
          # recovered here -- if the cgroup numbers come back clean, the next
          # step is capturing the count in-process on the abort path.
          echo "=== map count ceiling ==="
          echo "vm.max_map_count = $(cat /proc/sys/vm/max_map_count 2>/dev/null || echo '?')"
          echo "this shell's maps  = $(wc -l < /proc/self/maps 2>/dev/null || echo '?')"
          echo "=== kernel ring buffer (OOM evidence) ==="
          (sudo dmesg | tail -40) 2>/dev/null || dmesg | tail -40 || true
      # The diagram freshness check shares this job: the claim tests already
      # run under `cargo nextest run`, so the only unique work is the stale-SVG
      # comparison — not worth a dedicated runner.
      - run: cargo run --locked -p doc-diagrams -- --check

  test-release:
    name: Test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --locked --workspace --profile ci --release
      - run: cargo test --locked --workspace --doc --release
      # A run on 2026-09-22 aborted the release test binary with a bare ENOMEM
      # from `register_buf_ring`. The error text blames RLIMIT_MEMLOCK, but that
      # was measured and ruled out: on kernel 6.12 the whole uring test suite
      # passes with the soft limit at 8 KiB, so the ring is not charged there.
      # What is left is genuine kernel memory pressure, which nothing recorded.
      # Capture it on failure so the next occurrence is diagnosable instead of
      # being re-argued from the same empty log.
      - name: Resource state (on failure)
        if: failure()
        run: |
          # GitHub runs this with `bash -e`, and a diagnostic that aborts partway
          # is worse than none: an unguarded non-zero status (a `for` whose last
          # `[ -r ]` test fails, say) truncates the step right before whatever it
          # was added to capture. This step only runs when the job has already
          # failed, so nothing here should ever be fatal.
          set +e
          echo "=== limits ==="; ulimit -a || true
          # `free` reads host-wide /proc/meminfo, so it cannot see a cgroup
          # limit. A run on 2026-09-29 aborted with io_uring_setup ENOMEM while
          # this reported 11.5 GiB free and 14.9 GiB available -- which rules
          # host memory out and leaves the accounting that `free` is blind to.
          echo "=== memory (HOST -- see cgroup below) ==="; free -m || true
          # io_uring charges ring memory to the memcg on modern kernels, so a
          # cgroup limit yields exactly this signature: ENOMEM at setup with the
          # host showing gigabytes free. `memory.events` and `memory.peak` are
          # retrospective -- they survive the death of the process that failed,
          # which `memory.current` alone does not.
          echo "=== cgroup memory (v2) ==="
          for f in memory.max memory.high memory.current memory.peak memory.events memory.swap.max; do
            [ -r "/sys/fs/cgroup/$f" ] && echo "--- $f ---" && cat "/sys/fs/cgroup/$f"
          done || true
          echo "=== cgroup memory of this process's own cgroup ==="
          cg=$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup 2>/dev/null)
          if [ -n "$cg" ] && [ -d "/sys/fs/cgroup$cg" ]; then
            for f in memory.max memory.current memory.peak memory.events; do
              [ -r "/sys/fs/cgroup$cg/$f" ] && echo "--- $cg/$f ---" && cat "/sys/fs/cgroup$cg/$f"
            done
          else
            echo "no cgroup v2 path for self; trying v1"
            for f in limit_in_bytes usage_in_bytes max_usage_in_bytes failcnt; do
              [ -r "/sys/fs/cgroup/memory/memory.$f" ] && echo "--- v1 memory.$f ---" && cat "/sys/fs/cgroup/memory/memory.$f"
            done
          fi
          # PSI records memory stall even when nothing was OOM-killed.
          echo "=== memory pressure (PSI) ==="; cat /proc/pressure/memory 2>/dev/null || echo "no PSI"
          # io_uring_setup mmaps its rings, so the map-count ceiling is a
          # candidate ENOMEM source that neither `ulimit -a` nor `free` shows.
          # NOTE: this records the LIMIT only. The failing process is already
          # gone by the time this step runs, so its own map count cannot be
          # recovered here -- if the cgroup numbers come back clean, the next
          # step is capturing the count in-process on the abort path.
          echo "=== map count ceiling ==="
          echo "vm.max_map_count = $(cat /proc/sys/vm/max_map_count 2>/dev/null || echo '?')"
          echo "this shell's maps  = $(wc -l < /proc/self/maps 2>/dev/null || echo '?')"
          echo "=== kernel ring buffer (OOM evidence) ==="
          (sudo dmesg | tail -40) 2>/dev/null || dmesg | tail -40 || true

  test-mio:
    name: Test (mio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --locked --workspace --profile ci --features force-mio
      - run: cargo test --locked --workspace --doc --features force-mio

  test-tls-unbuffered:
    name: Test (tls-unbuffered)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --locked --workspace --profile ci --features tls-unbuffered
      - run: cargo test --locked --workspace --doc --features tls-unbuffered

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --locked --workspace --profile ci
      - run: cargo test --locked --workspace --doc

  test-mio-release:
    name: Test (mio, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --locked --workspace --profile ci --features force-mio --release
      - run: cargo test --locked --workspace --doc --features force-mio --release

  integration-clients:
    name: Integration (public servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ringline-h2 --test public_servers -- --ignored --nocapture
      - run: cargo test --locked -p ringline-h3 --test public_servers -- --ignored --nocapture
      - run: cargo test --locked -p ringline-http --test public_servers -- --ignored --nocapture

  integration-clients-mio:
    name: Integration (public servers, mio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ringline-h2 --test public_servers --features ringline/force-mio -- --ignored --nocapture
      - run: cargo test --locked -p ringline-http --test public_servers --features ringline-http/force-mio -- --ignored --nocapture

  integration-services:
    name: Integration (Redis + Memcache)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ringline-redis --test integration -- --ignored --nocapture
      - run: cargo test --locked -p ringline-memcache --test integration -- --ignored --nocapture

  integration-services-mio:
    name: Integration (Redis + Memcache, mio)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ringline-redis --test integration --features ringline-redis/force-mio -- --ignored --nocapture
      - run: cargo test --locked -p ringline-memcache --test integration --features ringline-memcache/force-mio -- --ignored --nocapture
