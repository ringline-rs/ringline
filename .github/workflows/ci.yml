name: CI

on:
  push:
    # release/** are maintenance branches (e.g. release/0.6.x): patch releases
    # are cut and tagged there by hand, so CI must run on them too.
    branches: [main, 'release/**']
  pull_request:
    # Backports reach release/** through PRs, and need the same gate.
    branches: [main, 'release/**']
  workflow_call:
  schedule:
    # Daily at 13:17 UTC so the RustSec advisory database catches
    # vulnerabilities published against our pinned deps even when nothing
    # in-tree changes.
    - cron: '17 13 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  clippy-mio:
    name: Clippy (mio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --features force-mio -- -D warnings

  clippy-tls-unbuffered:
    name: Clippy (tls-unbuffered)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --features tls-unbuffered -- -D warnings

  clippy-macos:
    name: Clippy (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-features --all-targets

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # `--deny warnings` promotes informational advisories
      # (unmaintained, unsound, notice) to errors. Downstream consumers
      # pulling ringline transitives get caught by their own audits, so
      # we hold the same bar here.
      - run: cargo audit --deny warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all
      # A run on 2026-09-22 aborted the release test binary with a bare ENOMEM
      # from `register_buf_ring`. The error text blames RLIMIT_MEMLOCK, but that
      # was measured and ruled out: on kernel 6.12 the whole uring test suite
      # passes with the soft limit at 8 KiB, so the ring is not charged there.
      # What is left is genuine kernel memory pressure, which nothing recorded.
      # Capture it on failure so the next occurrence is diagnosable instead of
      # being re-argued from the same empty log.
      - name: Resource state (on failure)
        if: failure()
        run: |
          echo "=== limits ==="; ulimit -a || true
          echo "=== memory ==="; free -m || true
          echo "=== kernel ring buffer (OOM evidence) ==="
          (sudo dmesg | tail -40) 2>/dev/null || dmesg | tail -40 || true
      # The diagram freshness check shares this job: the claim tests already
      # run under `cargo test --all`, so the only unique work is the stale-SVG
      # comparison — not worth a dedicated runner.
      - run: cargo run --locked -p doc-diagrams -- --check

  test-release:
    name: Test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all --release
      # A run on 2026-09-22 aborted the release test binary with a bare ENOMEM
      # from `register_buf_ring`. The error text blames RLIMIT_MEMLOCK, but that
      # was measured and ruled out: on kernel 6.12 the whole uring test suite
      # passes with the soft limit at 8 KiB, so the ring is not charged there.
      # What is left is genuine kernel memory pressure, which nothing recorded.
      # Capture it on failure so the next occurrence is diagnosable instead of
      # being re-argued from the same empty log.
      - name: Resource state (on failure)
        if: failure()
        run: |
          echo "=== limits ==="; ulimit -a || true
          echo "=== memory ==="; free -m || true
          echo "=== kernel ring buffer (OOM evidence) ==="
          (sudo dmesg | tail -40) 2>/dev/null || dmesg | tail -40 || true

  test-mio:
    name: Test (mio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all --features force-mio

  test-tls-unbuffered:
    name: Test (tls-unbuffered)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all --features tls-unbuffered

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all

  test-mio-release:
    name: Test (mio, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all --features force-mio --release

  integration-clients:
    name: Integration (public servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ringline-h2 --test public_servers -- --ignored --nocapture
      - run: cargo test --locked -p ringline-h3 --test public_servers -- --ignored --nocapture
      - run: cargo test --locked -p ringline-http --test public_servers -- --ignored --nocapture

  integration-clients-mio:
    name: Integration (public servers, mio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ringline-h2 --test public_servers --features ringline/force-mio -- --ignored --nocapture
      - run: cargo test --locked -p ringline-http --test public_servers --features ringline-http/force-mio -- --ignored --nocapture

  integration-services:
    name: Integration (Redis + Memcache)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ringline-redis --test integration -- --ignored --nocapture
      - run: cargo test --locked -p ringline-memcache --test integration -- --ignored --nocapture

  integration-services-mio:
    name: Integration (Redis + Memcache, mio)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ringline-redis --test integration --features ringline-redis/force-mio -- --ignored --nocapture
      - run: cargo test --locked -p ringline-memcache --test integration --features ringline-memcache/force-mio -- --ignored --nocapture
